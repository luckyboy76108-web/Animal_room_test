<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Rack OS v8.1 - Absolute Precision Pro</title>
    <style>
        :root {
            --breeding-color: #ffffff;
            --mating-color: #ffd60a;
            --glass-panel: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --slot-bg: rgba(255, 255, 255, 0.02);
            --slot-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #8e8e93;
        }

        body {
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: radial-gradient(circle at 50% 30%, #1e1e2f, #000000 85%);
            color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }

        header {
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(40px);
            box-sizing: border-box; height: 65px;
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 700; background: linear-gradient(90deg, #fff, #a1a1a6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .top-right { display: flex; align-items: center; gap: 20px; }
        .progress-container { width: 180px; background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff9500, #ffcc00); width: 0%; transition: width 0.3s; }
        .progress-text { font-size: 13px; color: var(--text-sub); font-weight: 600; }
        
        .header-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: white; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .header-btn:hover { background: rgba(255,255,255,0.15); }
        .header-btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

        .workspace { flex: 1; display: flex; overflow: hidden; }

        .map-nav {
            width: 300px; border-right: 1px solid var(--glass-border); padding: 25px 20px;
            display: flex; flex-direction: column; gap: 20px; background: rgba(0,0,0,0.3); overflow-y: auto;
        }
        .section-title { font-size: 13px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        
        .config-box { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px; }
        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .config-row:last-child { margin-bottom: 0; }
        .config-input { width: 50px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px; border-radius: 6px; text-align: center; }

        .room-map {
            position: relative; width: 100%; height: 360px;
            margin-top: auto; margin-bottom: 0;
            background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            border-radius: 24px; box-sizing: border-box; overflow: hidden;
        }

        .map-rack {
            position: absolute;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .map-rack.active { border-color: #ffcc00; background: rgba(255, 204, 0, 0.08); box-shadow: 0 0 15px rgba(255,204,0,0.2); }
        .map-rack h3 { margin: 0 0 5px 0; font-size: 16px; font-weight: 600; }
        .map-rack p { margin: 0; font-size: 12px; color: var(--text-sub); }
        .map-rack.drag-over { background: rgba(52, 199, 89, 0.15); border-color: #34c759; transform: scale(1.03); }

        .rack-A { top: 15px; left: 15px; width: 80px; height: 110px; }
        .rack-B { top: 15px; right: 15px; width: 80px; height: 110px; }
        .rack-C { top: 140px; left: 15px; width: 80px; height: 110px; }
        .change-station {
            position: absolute; top: 140px; right: 15px; width: 80px; height: 110px;
            border: 1px dashed rgba(255,255,255,0.12); background: rgba(255,255,255,0.01);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: var(--text-sub); text-align: center; line-height: 1.4; font-weight: 600;
        }
        .rack-D { top: 265px; left: 85px; width: 180px; height: 32px; }
        .rack-E { top: 310px; left: 85px; width: 180px; height: 32px; }

        .board-pane { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; overflow: auto; box-sizing: border-box; }
        .board-header { margin-bottom: 20px; }
        .board-title { font-size: 26px; font-weight: 700; margin: 0; }
        .board-desc { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        .grid-container {
            background: var(--glass-panel); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 32px; padding: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative; width: fit-content;
        }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 92px); gap: 14px; position: relative; }

        .slot {
            width: 92px; height: 92px; border-radius: 24px; background: var(--slot-bg);
            border: 1px dashed var(--slot-border); position: relative;
            display: flex; align-items: center; justify-content: center; box-sizing: border-box;
        }
        .slot::before { content: attr(data-label); font-size: 11px; color: rgba(255,255,255,0.1); font-weight: 600; }
        .slot.ghost-slot { border-color: rgba(255, 55, 95, 0.35); background: rgba(255, 55, 95, 0.02); }

        .cage {
            width: 92px; height: 92px; border-radius: 24px; position: absolute;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; box-shadow: 0 8px 20px rgba(0,0,0,0.3); box-sizing: border-box;
            cursor: grab; touch-action: none; z-index: 10;
            transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .cage.breeding { 
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f5 35%, #d1d1d6 50%, #e5e5ea 65%, #ffffff 100%);
            color: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #a1a1a6;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 5px 15px rgba(255, 255, 255, 0.05), 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .cage.mating { 
            background: linear-gradient(135deg, #ffeb66 0%, #ffd60a 35%, #e0b400 50%, #ffd60a 65%, #ffdf33 100%);
            color: #1c1c1e; border: 1px solid rgba(255, 235, 102, 0.9);
            border-bottom: 2px solid #b38e00;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), 0 5px 15px rgba(255, 214, 10, 0.1), 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .cage.floating {
            cursor: grabbing; z-index: 9999 !important;
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
            pointer-events: none; position: fixed !important;
            left: 0; top: 0; margin: 0 !important;
            transition: none !important; 
        }

        .strain-code { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; }
        .sub-id { font-size: 12px; font-weight: 700; margin-top: 5px; background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 6px; }

        .side-panel {
            position: fixed; top: 0; right: -360px; width: 330px; height: 100vh;
            background: rgba(25, 25, 30, 0.85); backdrop-filter: blur(40px); border-left: 1px solid var(--glass-border);
            z-index: 1500; padding: 40px 25px; box-shadow: -20px 0 40px rgba(0,0,0,0.5);
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-sizing: border-box;
        }
        .side-panel.open { right: 0; }
        .side-panel h2 { font-size: 22px; margin-top: 0; margin-bottom: 25px; }
        
        .match-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .match-key { width: 40px; text-align: center; font-weight: bold; font-size: 16px; color: #ffcc00; }
        .match-val { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 8px; border-radius: 8px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000;
            display: none; justify-content: center; align-items: center;
        }
        .modal {
            background: rgba(28, 28, 35, 0.95); border: 1px solid var(--glass-border); border-radius: 28px;
            width: 440px; padding: 35px; box-shadow: 0 40px 80px rgba(0,0,0,0.6); box-sizing: border-box;
        }
        .modal h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; font-weight: 600; }
        .form-control {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3); color: white; font-size: 14px; box-sizing: border-box;
        }
        .form-row { display: flex; gap: 10px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px; }
        .btn { padding: 12px 18px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-save { background: #ffcc00; color: #1c1c1e; }
        .btn-delete { background: #FF375F; color: white; margin-right: auto; }

        #selection-marquee {
            position: fixed; display: none; z-index: 9999; pointer-events: none;
            background: rgba(10, 132, 255, 0.2); border: 1px solid rgba(10, 132, 255, 0.8);
            border-radius: 4px; backdrop-filter: blur(2px);
        }
        
        .cage.selected {
            filter: brightness(0.4) saturate(1.2);
            border: 2px solid #FF375F !important;
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(255, 55, 95, 0.4);
        }

        .drag-badge {
            position: absolute; top: -10px; right: -10px;
            background: #FF375F; color: white; font-size: 14px; font-weight: bold;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 55, 95, 0.5); z-index: 10000;
        }

        /* 일괄 작업 플로팅 바 */
        .batch-bar {
            position: fixed; bottom: -120px; left: 50%; transform: translateX(-50%);
            background: rgba(28, 28, 35, 0.95); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 15px 25px; display: flex; align-items: center; gap: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 3000;
            transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            white-space: nowrap;
        }
        .batch-bar.show { bottom: 40px; }
        .batch-count { font-weight: 700; color: #ffcc00; font-size: 15px; letter-spacing: -0.5px; }

        /* 연속/비연속 상태 뱃지 */
        .contiguous-badge {
            font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px;
            display: flex; align-items: center; gap: 5px;
        }
        .contiguous-badge.ok { background: rgba(52, 199, 89, 0.2); color: #34c759; border: 1px solid rgba(52,199,89,0.4); }
        .contiguous-badge.ng { background: rgba(255, 55, 95, 0.15); color: #FF375F; border: 1px solid rgba(255,55,95,0.3); }

        .btn-active {
            background: #0a84ff !important; color: white !important;
            border-color: #0a84ff !important; box-shadow: 0 0 15px rgba(10, 132, 255, 0.4);
        }
        
        body.batch-mode .cage { transition: filter 0.3s, transform 0.3s; }
        body.batch-mode .cage:not(.selected) {
            filter: brightness(0.4) opacity(0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<header>
    <h1>Smart Rack OS <span style="font-size:14px; color:var(--mating-color); font-weight:bold; margin-left:6px;">v8.1 Absolute Precision</span></h1>
    <div class="top-right">
        <div class="progress-text">공간 사용률: <span id="occupancy-label">0%</span></div>
        <div class="progress-container"><div class="progress-bar" id="occupancy-bar"></div></div>
        
        <button class="header-btn" id="btn-batch" onclick="toggleBatchMode()">☑️ 일괄 선택</button>
        <button class="header-btn" onclick="openMatchPanel(event)">🧬 Strain 매칭표 편집</button>
    </div>
</header>

<div class="workspace">
    <div class="map-nav">
        <div class="section-title">랙 줄 수 세부 설정</div>
        <div class="config-box" id="config-box"></div>
        
        <div style="border-bottom: 1px solid var(--glass-border); margin: 5px 0;"></div>
        <div class="section-title">연구실 배치 도면 (클릭하여 전환)</div>
        
        <div class="room-map" id="room-map">
            <div class="map-rack rack-A" data-rack="A" id="map-A">A</div>
            <div class="map-rack rack-B" data-rack="B" id="map-B">B</div>
            <div class="map-rack rack-C" data-rack="C" id="map-C">C</div>
            <div class="map-rack rack-D" data-rack="D" id="map-D">D</div>
            <div class="map-rack rack-E" data-rack="E" id="map-E">E</div>
            <div class="change-station">Change<br>Station</div>
        </div>
    </div>

    <div class="board-pane">
        <div class="board-header">
            <h2 class="board-title" id="current-rack-title">Rack A</h2>
            <div class="board-desc" id="current-rack-desc">계산 중...</div>
        </div>
        
        <div class="grid-container">
            <div class="grid-7" id="main-grid"></div>
        </div>
    </div>
</div>

<div class="side-panel" id="match-panel">
    <h2>🧬 Strain 기호 커스텀</h2>
    <p style="font-size:12px; color:var(--text-sub); margin-bottom:20px;">기호 알파벳과 Strain 명칭을 실시간으로 수정하세요.</p>
    <div id="mapping-list"></div>
    <button class="header-btn" style="width:100%; margin-top:30px; background:#ffcc00; color:#1c1c1e;" onclick="toggleMatchPanel()">설정 완료 및 닫기</button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modal-title">케이지 관리</h2>
        <input type="hidden" id="m-id">
        
        <div class="form-group">
            <label>용도 구분</label>
            <select id="m-type" class="form-control" onchange="toggleModalFields()">
                <option value="breeding">Breeding (생산용 - 흰색)</option>
                <option value="mating">Mating (교배용 - 노란색)</option>
            </select>
        </div>
        <div class="form-row">
            <div class="form-group" style="flex:1;">
                <label>표시 알파벳 기호</label>
                <input type="text" id="m-code" class="form-control" placeholder="예: A, C">
            </div>
            <div class="form-group" style="flex:1;">
                <label id="sub-label">서브 번호/마리수</label>
                <input type="text" id="m-sub" class="form-control" placeholder="A52형태 자동 연산">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group" style="flex:1;">
                <label>암컷 수 (♀)</label>
                <input type="number" id="m-female" class="form-control" value="0" min="0">
            </div>
            <div class="form-group" style="flex:1;">
                <label>수컷 수 (♂)</label>
                <input type="number" id="m-male" class="form-control" value="0" min="0">
            </div>
        </div>
        <div class="form-group" id="dob-group">
            <label>DOB (출생일)</label>
            <input type="date" id="m-dob" class="form-control">
        </div>
        <div class="form-group" id="dom-group">
            <label>DOM (교배일)</label>
            <input type="date" id="m-dom" class="form-control">
        </div>
        <div class="form-group">
            <label>특이사항 (Notes)</label>
            <textarea id="m-notes" class="form-control" rows="2"></textarea>
        </div>
        
        <div class="modal-btns">
            <button class="btn btn-delete" id="btn-delete" onclick="deleteCage()">삭제</button>
            <button class="btn btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn btn-save" onclick="saveCage()">적용</button>
        </div>
    </div>
</div>

<div id="selection-marquee"></div>

<!-- 일괄 작업 바 (연속성 상태 뱃지 포함) -->
<div class="batch-bar" id="batch-bar">
    <span class="batch-count" id="batch-count">0개 선택됨</span>
    <span class="contiguous-badge" id="contiguous-badge"></span>
    <button class="header-btn" style="background: rgba(255,255,255,0.1);" onclick="clearSelection()">선택 해제</button>
    <button class="header-btn" id="btn-batch-move" style="background: #0a84ff; border-color: #0a84ff;" onclick="startBatchMove()">🚚 일괄 이동</button>
    <button class="header-btn" style="background: #FF375F; border-color: #FF375F;" onclick="deleteSelectedCages()">🗑️ 일괄 삭제</button>
</div>

<script>
    let RACK_ROWS = { 'A': 5, 'B': 5, 'C': 5, 'D': 3, 'E': 3 };
    let currentRack = 'A';
    let STRAIN_MAP = { 'A': 'K18-hACE2', 'C': 'Aim2', 'W': 'Wild Type' };

    let cages = [];
    ['A', 'B', 'C'].forEach(rack => {
        for(let i=0; i<35; i++) {
            cages.push({ 
                id: `${rack}_${i}`, rackId: rack, cellIdx: i, 
                type: i % 3 === 0 ? 'mating' : 'breeding', 
                code: rack === 'B' ? 'C' : 'A', subId: `-${i+1}`, female: 1, male: 1 
            });
        }
    });
    for(let i=0; i<8; i++) {
        cages.push({ id: `D_${i}`, rackId: 'D', cellIdx: i, type: 'breeding', code: 'W', subId: `${i+1}`, female: 2, male: 0 });
    }

    let isBatchMode = false;
    let selectedIds = new Set();
    let dragData = { active: false, isDragging: false, items: [], primaryId: null, blockOffset: 0, startX: 0, startY: 0 };
    let marquee = { active: false, startX: 0, startY: 0 };
    let currentHoverIdx = -1;
    let batchMoveMode = false; // 일괄 이동 대기 상태

    // ─────────────────────────────────────────────
    // 📐 연속성 체크: 현재 랙 내 선택된 케이지들이
    //    전체 랙을 걸쳐서도 연속된 슬롯을 차지하는지 확인
    //    (A랙 마지막 슬롯 + B랙 첫 슬롯처럼 랙 경계도 연속으로 봄)
    // ─────────────────────────────────────────────
    function checkContiguous() {
        if (selectedIds.size === 0) return { ok: false, cages: [] };
        if (selectedIds.size === 1) return { ok: true, cages: [] };

        // 선택된 케이지들을 (rackId, cellIdx) 기준으로 정렬
        // 랙 순서는 A→B→C→D→E
        const rackOrder = ['A', 'B', 'C', 'D', 'E'];
        const selected = cages.filter(c => selectedIds.has(c.id));

        // 각 케이지에 "전체 절대 인덱스" 부여
        // 각 랙의 capacity 누적합을 기반으로 계산
        function getAbsoluteIdx(cage) {
            let offset = 0;
            for (const rName of rackOrder) {
                if (rName === cage.rackId) break;
                offset += RACK_ROWS[rName] * 7;
            }
            return offset + cage.cellIdx;
        }

        const sorted = selected.slice().sort((a, b) => getAbsoluteIdx(a) - getAbsoluteIdx(b));
        const indices = sorted.map(c => getAbsoluteIdx(c));

        let isContiguous = true;
        for (let i = 0; i < indices.length - 1; i++) {
            if (indices[i+1] !== indices[i] + 1) { isContiguous = false; break; }
        }

        return { ok: isContiguous, cages: sorted };
    }

    // ─────────────────────────────────────────────
    // 🔄 배치 모드 토글
    // ─────────────────────────────────────────────
    function toggleBatchMode() {
        isBatchMode = !isBatchMode;
        const btn = document.getElementById('btn-batch');
        if (isBatchMode) {
            document.body.classList.add('batch-mode');
            btn.classList.add('btn-active');
            btn.innerText = '✅ 선택 완료';
            batchMoveMode = false;
        } else {
            document.body.classList.remove('batch-mode');
            btn.classList.remove('btn-active');
            btn.innerText = '☑️ 일괄 선택';
            marquee.active = false;
            batchMoveMode = false;
            document.getElementById('selection-marquee').style.display = 'none';
            clearSelection();
        }
    }

    // ─────────────────────────────────────────────
    // 🚚 일괄 이동 버튼 클릭: 연속 선택된 케이지를
    //    드래그 가능 상태로 전환
    // ─────────────────────────────────────────────
    function startBatchMove() {
        const result = checkContiguous();
        if (!result.ok) return;

        // 배치 모드 해제하고 이동 대기 상태로 전환
        batchMoveMode = true;
        isBatchMode = false;
        document.body.classList.remove('batch-mode');
        const btn = document.getElementById('btn-batch');
        btn.classList.remove('btn-active');
        btn.innerText = '☑️ 일괄 선택';

        // 안내 배지 업데이트
        const bar = document.getElementById('batch-bar');
        document.getElementById('batch-count').innerText = `${selectedIds.size}개 케이지 이동 준비됨`;
        document.getElementById('contiguous-badge').className = 'contiguous-badge ok';
        document.getElementById('contiguous-badge').innerText = '✦ 드래그하여 이동';
        document.getElementById('btn-batch-move').style.display = 'none';
        bar.classList.add('show');
    }

    // ─────────────────────────────────────────────
    // 🔲 허공 Marquee 드래그 엔진 (누적 선택 지원)
    // ─────────────────────────────────────────────
    document.addEventListener('pointerdown', (e) => {
        if (!isBatchMode) return; 
        if (e.button !== 0) return;
        if (e.target.closest('.cage') || e.target.closest('header') || 
            e.target.closest('.map-nav') || e.target.closest('.modal') || 
            e.target.closest('.batch-bar')) return;
        
        e.preventDefault();

        marquee.active = true;
        marquee.startX = e.clientX;
        marquee.startY = e.clientY;
        // ✅ 수정: 항상 누적 모드 — 기존 선택을 초기화하지 않음
        marquee.initialSelected = new Set(selectedIds);

        const box = document.getElementById('selection-marquee');
        box.style.display = 'block';
        box.style.left = e.clientX + 'px';
        box.style.top = e.clientY + 'px';
        box.style.width = '0px';
        box.style.height = '0px';

        document.addEventListener('pointermove', onMarqueeMove);
        document.addEventListener('pointerup', onMarqueeUp);
    });

    function onMarqueeMove(e) {
        if (!marquee.active) return;
        const box = document.getElementById('selection-marquee');
        const x = Math.min(e.clientX, marquee.startX);
        const y = Math.min(e.clientY, marquee.startY);
        const w = Math.abs(e.clientX - marquee.startX);
        const h = Math.abs(e.clientY - marquee.startY);
        
        box.style.left = x + 'px'; box.style.top = y + 'px';
        box.style.width = w + 'px'; box.style.height = h + 'px';

        // ✅ 수정: 이전 드래그로 선택된 것(initialSelected)을 유지하면서
        //         현재 드래그 영역과 겹치는 케이지를 추가로 선택
        const newSelected = new Set(marquee.initialSelected);

        document.querySelectorAll('#main-grid .cage').forEach(el => {
            const r = el.getBoundingClientRect();
            const intersect = !(r.right < x || r.left > x + w || r.bottom < y || r.top > y + h);
            if (intersect) newSelected.add(el.id);
        });

        selectedIds = newSelected;
        updateSelectionUI();
    }

    function onMarqueeUp(e) {
        if (!marquee.active) return;
        marquee.active = false;
        document.getElementById('selection-marquee').style.display = 'none';
        document.removeEventListener('pointermove', onMarqueeMove);
        document.removeEventListener('pointerup', onMarqueeUp);
        // 드래그 종료 후 연속성 체크하여 UI 업데이트
        updateSelectionUI();
    }

    // ─────────────────────────────────────────────
    // 🚀 케이지 드래그 앤 드롭 엔진
    // ─────────────────────────────────────────────
    function setupDragEngine(cageEl, cageId) {
        cageEl.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return; 
            e.preventDefault();
            e.stopPropagation();

            // 일괄 선택 모드: 클릭으로 토글
            if (isBatchMode) {
                if (selectedIds.has(cageId)) selectedIds.delete(cageId);
                else selectedIds.add(cageId);
                updateSelectionUI();
                return; 
            }

            // 일괄 이동 대기 모드: 선택된 케이지 중 하나를 드래그하면 전체 이동
            if (batchMoveMode && selectedIds.has(cageId)) {
                dragData.active = true;
                dragData.isDragging = false;
                dragData.startX = e.clientX;
                dragData.startY = e.clientY;
                dragData.primaryId = cageId;
                dragData.items = [];

                const result = checkContiguous();
                if (result.ok && result.cages.length > 0) {
                    // 현재 랙에 있는 선택된 케이지만 이동
                    const currentRackSelected = result.cages
                        .filter(c => c.rackId === currentRack)
                        .sort((a, b) => a.cellIdx - b.cellIdx);

                    if (currentRackSelected.length > 0) {
                        dragData.blockOffset = currentRackSelected.findIndex(c => c.id === cageId);
                        if (dragData.blockOffset === -1) dragData.blockOffset = 0;
                        currentRackSelected.forEach(c => {
                            let el = document.getElementById(c.id);
                            if (!el) return;
                            let rect = el.getBoundingClientRect();
                            dragData.items.push({ id: c.id, el, shiftX: e.clientX - rect.left, shiftY: e.clientY - rect.top });
                        });
                    } else {
                        initSingleDrag(cageEl, cageId, e);
                    }
                } else {
                    initSingleDrag(cageEl, cageId, e);
                }

                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
                return;
            }

            // 일반 모드: 단일/다중 드래그
            dragData.active = true;
            dragData.isDragging = false;
            dragData.startX = e.clientX;
            dragData.startY = e.clientY;
            dragData.primaryId = cageId;
            dragData.items = [];

            if (!selectedIds.has(cageId)) {
                clearSelection();
                initSingleDrag(cageEl, cageId, e);
            } else {
                let selectedCages = cages.filter(c => selectedIds.has(c.id) && c.rackId === currentRack).sort((a, b) => a.cellIdx - b.cellIdx);
                let isContiguous = true;
                for (let i = 0; i < selectedCages.length - 1; i++) {
                    if (selectedCages[i+1].cellIdx !== selectedCages[i].cellIdx + 1) { isContiguous = false; break; }
                }

                if (isContiguous && selectedCages.length > 0) {
                    dragData.blockOffset = selectedCages.findIndex(c => c.id === cageId);
                    selectedCages.forEach(c => {
                        let el = document.getElementById(c.id);
                        let rect = el.getBoundingClientRect();
                        dragData.items.push({ id: c.id, el, shiftX: e.clientX - rect.left, shiftY: e.clientY - rect.top });
                    });
                } else {
                    initSingleDrag(cageEl, cageId, e); 
                }
            }

            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
        });
    }

    function initSingleDrag(cageEl, cageId, e) {
        dragData.blockOffset = 0;
        let rect = cageEl.getBoundingClientRect();
        dragData.items.push({ id: cageId, el: cageEl, shiftX: e.clientX - rect.left, shiftY: e.clientY - rect.top });
    }

    function onPointerMove(e) {
        if (!dragData.active) return;
        
        if (!dragData.isDragging) {
            if (Math.abs(e.clientX - dragData.startX) > 5 || Math.abs(e.clientY - dragData.startY) > 5) {
                dragData.isDragging = true;
                dragData.items.forEach(item => {
                    const rect = item.el.getBoundingClientRect();
                    document.body.appendChild(item.el);
                    item.el.classList.add('floating');
                    item.el.classList.remove('selected');
                    
                    if (item.id === dragData.primaryId) {
                        item.el.style.width = rect.width + 'px';
                        item.el.style.height = rect.height + 'px';
                        item.el.style.transformOrigin = `${dragData.shiftX}px ${dragData.shiftY}px`;
                        
                        if (dragData.items.length > 1) {
                            let badge = document.createElement('div');
                            badge.className = 'drag-badge'; badge.id = 'drag-badge';
                            badge.innerText = dragData.items.length;
                            item.el.appendChild(badge);
                        }
                    } else {
                        item.el.style.display = 'none'; 
                    }
                });
            } else return; 
        }

        dragData.items.forEach(item => {
            if (item.id === dragData.primaryId) {
                item.el.style.left = (e.clientX - item.shiftX) + 'px';
                item.el.style.top = (e.clientY - item.shiftY) + 'px';
            }
        });

        let hoveredRack = null;
        document.querySelectorAll('.map-rack').forEach(rackEl => {
            const r = rackEl.getBoundingClientRect();
            if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
                rackEl.classList.add('drag-over'); hoveredRack = rackEl.dataset.rack;
            } else rackEl.classList.remove('drag-over');
        });

        if (hoveredRack && hoveredRack !== currentRack) {
            currentRack = hoveredRack; renderMainBoard(); buildLeftSidebar();
        }

        let minD = 9999; let hoverIdx = -1;
        document.querySelectorAll('#main-grid .slot').forEach(slot => {
            const r = slot.getBoundingClientRect();
            const d = Math.hypot((r.left + r.width/2) - e.clientX, (r.top + r.height/2) - e.clientY);
            if (d < minD && d < 55) { minD = d; hoverIdx = parseInt(slot.dataset.idx); }
        });
        previewShift(hoverIdx);
    }

    function calculateShiftLogic(targetIdx, isSim) {
        if (targetIdx === -1) return null;
        
        let K = dragData.items.length;
        let blockTargetIdx = targetIdx - dragData.blockOffset;
        let capacity = RACK_ROWS[currentRack] * 7;
        
        if (blockTargetIdx < 0) blockTargetIdx = 0;
        if (blockTargetIdx + K > capacity) blockTargetIdx = capacity - K;

        let blockEnd = blockTargetIdx + K - 1;
        let dragIds = dragData.items.map(i => i.id);
        
        let workCages = cages.filter(c => c.rackId === currentRack && !dragIds.includes(c.id)).map(c => ({...c}));
        let occupants = workCages.filter(c => c.cellIdx >= blockTargetIdx && c.cellIdx <= blockEnd);

        if (occupants.length > 0) {
            let isLeftmost = (blockTargetIdx % 7 === 0);
            let shiftedLeft = false;

            if (!isLeftmost) {
                let emptyLeftSlots = [];
                for (let i = blockTargetIdx - 1; i >= 0; i--) {
                    if (!workCages.some(c => c.cellIdx === i)) emptyLeftSlots.push(i);
                    if (emptyLeftSlots.length >= occupants.length) break;
                }
                if (emptyLeftSlots.length >= occupants.length) {
                    occupants.sort((a,b) => b.cellIdx - a.cellIdx);
                    occupants.forEach((occ, idx) => occ.cellIdx = emptyLeftSlots[idx]);
                    shiftedLeft = true;
                }
            }

            if (!shiftedLeft) {
                let emptyRightSlots = [];
                for (let i = blockEnd + 1; i < capacity + 100; i++) {
                    if (!workCages.some(c => c.cellIdx === i)) emptyRightSlots.push(i);
                    if (emptyRightSlots.length >= occupants.length) break;
                }
                occupants.sort((a,b) => a.cellIdx - b.cellIdx);
                occupants.forEach((occ, idx) => occ.cellIdx = emptyRightSlots[idx]);
            }
        }
        return { blockTargetIdx, workCages };
    }

    function previewShift(targetIdx) {
        if (currentHoverIdx === targetIdx) return; 
        currentHoverIdx = targetIdx;

        const grid = document.getElementById('main-grid');
        const slots = grid.querySelectorAll('.slot');
        
        let result = calculateShiftLogic(targetIdx, true);
        if (!result) return;

        result.workCages.forEach(cage => {
            const el = document.getElementById(cage.id);
            const targetSlot = slots[cage.cellIdx];
            if (el && targetSlot) {
                el.style.left = targetSlot.offsetLeft + 'px'; el.style.top = targetSlot.offsetTop + 'px';
            }
        });
    }

    function onPointerUp(e) {
        if (!dragData.active) return;
        dragData.active = false;
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);

        if (!dragData.isDragging) {
            // 일괄 이동 대기 모드일 때는 클릭해도 모달 안 열림
            if (!batchMoveMode) {
                clearSelection();
                openModal(dragData.primaryId);
            }
            return;
        }

        let finalIdx = currentHoverIdx; 
        previewShift(-1); 
        
        dragData.items.forEach(item => {
            item.el.classList.remove('floating'); item.el.style.display = '';
            let badge = document.getElementById('drag-badge');
            if (badge) badge.remove();
            item.el.remove();
        });

        if (finalIdx !== -1) {
            let result = calculateShiftLogic(finalIdx, false);
            if (result) {
                result.workCages.forEach(wc => {
                    let target = cages.find(c => c.id === wc.id);
                    if (target) target.cellIdx = wc.cellIdx;
                });
                
                dragData.items.forEach((item, idx) => {
                    let target = cages.find(c => c.id === item.id);
                    if (target) {
                        target.rackId = currentRack; target.cellIdx = result.blockTargetIdx + idx;
                    }
                });
            }
        }

        // 이동 완료 후 일괄 이동 모드 해제
        if (batchMoveMode) {
            batchMoveMode = false;
            clearSelection();
        } else {
            clearSelection();
        }

        renderMainBoard();
        document.querySelectorAll('.map-rack').forEach(el => el.classList.remove('drag-over'));
    }

    // ─────────────────────────────────────────────
    // 🪄 UI 업데이트
    // ─────────────────────────────────────────────
    function updateSelectionUI() {
        document.querySelectorAll('.cage').forEach(el => {
            if (selectedIds.has(el.id)) el.classList.add('selected');
            else el.classList.remove('selected');
        });

        const bar = document.getElementById('batch-bar');
        const badge = document.getElementById('contiguous-badge');
        const moveBtn = document.getElementById('btn-batch-move');
        const batchBtn = document.getElementById('btn-batch');

        if (selectedIds.size > 0 && !batchMoveMode) {
            bar.classList.add('show');
            document.getElementById('batch-count').innerText = `${selectedIds.size}개 케이지 선택됨`;

            const result = checkContiguous();
            if (result.ok) {
                // ✅ 연속 선택: 이동 버튼 활성화, 배치 버튼도 정상
                badge.className = 'contiguous-badge ok';
                badge.innerText = '✦ 연속 배치 (이동 가능)';
                moveBtn.style.display = '';
                moveBtn.removeAttribute('disabled');
                batchBtn.removeAttribute('disabled');
            } else {
                // ❌ 비연속 선택: 이동 버튼 비활성화, 배치 버튼도 비활성화
                badge.className = 'contiguous-badge ng';
                badge.innerText = '✕ 비연속 (이동 불가)';
                moveBtn.setAttribute('disabled', true);
                batchBtn.setAttribute('disabled', true);
            }
        } else if (selectedIds.size === 0 && !batchMoveMode) {
            bar.classList.remove('show');
            badge.className = 'contiguous-badge';
            badge.innerText = '';
            batchBtn.removeAttribute('disabled');
            moveBtn.style.display = '';
        }
    }

    function clearSelection() {
        selectedIds.clear();
        batchMoveMode = false;
        document.getElementById('btn-batch-move').style.display = '';

        // 배치 모드 버튼 상태 복원
        const batchBtn = document.getElementById('btn-batch');
        batchBtn.removeAttribute('disabled');
        if (!isBatchMode) {
            batchBtn.classList.remove('btn-active');
            batchBtn.innerText = '☑️ 일괄 선택';
        }

        updateSelectionUI();
    }

    function deleteSelectedCages() {
        if (!confirm(`선택한 ${selectedIds.size}개의 케이지를 모두 삭제하시겠습니까?`)) return;
        cages = cages.filter(c => !selectedIds.has(c.id));
        clearSelection(); renderMainBoard(); buildLeftSidebar();
    }

    // ─────────────────────────────────────────────
    // 📋 메인 보드 렌더링
    // ─────────────────────────────────────────────
    function renderMainBoard() {
        const grid = document.getElementById('main-grid');
        document.getElementById('current-rack-title').innerText = `Rack ${currentRack}`;
        
        const baseCapacity = RACK_ROWS[currentRack] * 7;
        const currentCages = cages.filter(c => c.rackId === currentRack);
        const maxIdx = currentCages.reduce((max, c) => Math.max(max, c.cellIdx), baseCapacity - 1);
        const totalCapacity = maxIdx + 1;

        document.getElementById('current-rack-desc').innerText = `${RACK_ROWS[currentRack]}행 × 7열 (${baseCapacity}칸 내부 정원)`;
        Array.from(grid.children).forEach(child => { if (child.classList.contains('slot')) child.remove(); });

        let slotsFragment = document.createDocumentFragment();
        for (let i = 0; i < totalCapacity; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot' + (i >= baseCapacity ? ' ghost-slot' : '');
            const rChar = String.fromCharCode(64 + Math.floor(i / 7) + 1);
            slot.setAttribute('data-label', `${rChar}-${(i % 7) + 1}`);
            slot.dataset.idx = i;
            slot.onclick = () => { if (!isBatchMode && !batchMoveMode) { clearSelection(); openModal(null, i); } };
            slotsFragment.appendChild(slot);
        }
        grid.prepend(slotsFragment);

        const slots = grid.querySelectorAll('.slot');
        const currentCageIds = currentCages.map(c => c.id);
        let dragIds = dragData.active && dragData.isDragging ? dragData.items.map(i => i.id) : [];

        Array.from(grid.querySelectorAll('.cage')).forEach(el => {
            if (!currentCageIds.includes(el.id) && !dragIds.includes(el.id)) el.remove();
        });

        currentCages.forEach(cage => {
            if (dragIds.includes(cage.id)) return; 

            let el = document.getElementById(cage.id);
            if (!el) {
                el = document.createElement('div'); el.id = cage.id; el.className = `cage ${cage.type}`;
                let displaySub = cage.type === 'mating' ? cage.code + cage.subId : cage.subId;
                if (cage.type === 'mating') {
                    el.innerHTML = `<span class="strain-code" style="font-size:24px; letter-spacing:-1px;">${displaySub}</span>`;
                } else {
                    el.innerHTML = `<span class="strain-code">${cage.code}</span><span class="sub-id">${displaySub}</span>`;
                }
                setupDragEngine(el, cage.id);
                grid.appendChild(el);
            }

            if (selectedIds.has(cage.id)) el.classList.add('selected');
            else el.classList.remove('selected');

            setTimeout(() => {
                const targetSlot = slots[cage.cellIdx];
                if (targetSlot) { el.style.left = targetSlot.offsetLeft + 'px'; el.style.top = targetSlot.offsetTop + 'px'; }
            }, 10);
        });
        updateStatsBar();
    }

    function buildLeftSidebar() {
        const configBox = document.getElementById('config-box');
        configBox.innerHTML = '';
        for (const [rName, rows] of Object.entries(RACK_ROWS)) {
            const rowDiv = document.createElement('div'); rowDiv.className = 'config-row';
            rowDiv.innerHTML = `<span>Rack ${rName} 세로 줄 수</span><input type="number" class="config-input" value="${rows}" min="1" max="10" data-rack="${rName}">`;
            rowDiv.querySelector('input').onchange = (e) => { RACK_ROWS[e.target.dataset.rack] = parseInt(e.target.value); renderMainBoard(); buildLeftSidebar(); };
            configBox.appendChild(rowDiv);
        }

        document.querySelectorAll('.map-rack').forEach(rackEl => {
            const rackName = rackEl.dataset.rack;
            rackEl.onclick = () => { currentRack = rackName; buildLeftSidebar(); renderMainBoard(); };
            if(rackName === currentRack) rackEl.classList.add('active');
            else rackEl.classList.remove('active');
        });
    }

    const modal = document.getElementById('modal');
    let targetSlotIdxForCreate = null;

    function openModal(cageId, slotIdx = null) {
        if (cageId) {
            const c = cages.find(x => x.id === cageId);
            document.getElementById('modal-title').innerText = "케이지 데이터 편집"; document.getElementById('m-id').value = c.id;
            document.getElementById('m-type').value = c.type; document.getElementById('m-code').value = c.code;
            document.getElementById('m-sub').value = c.subId; document.getElementById('m-female').value = c.female !== undefined ? c.female : 0;
            document.getElementById('m-male').value = c.male !== undefined ? c.male : 0; document.getElementById('m-dob').value = c.dob || "";
            document.getElementById('m-dom').value = c.dom || ""; document.getElementById('m-notes').value = c.notes || "";
            document.getElementById('btn-delete').style.display = 'block';
        } else {
            targetSlotIdxForCreate = slotIdx;
            document.getElementById('modal-title').innerText = `신규 등록 (Rack ${currentRack})`; document.getElementById('m-id').value = "";
            document.getElementById('m-type').value = "breeding"; document.getElementById('m-code').value = "";
            document.getElementById('m-sub').value = ""; document.getElementById('m-female').value = 0;
            document.getElementById('m-male').value = 0; document.getElementById('m-dob').value = "";
            document.getElementById('m-dom').value = ""; document.getElementById('m-notes').value = "";
            document.getElementById('btn-delete').style.display = 'none';
        }
        toggleModalFields(); modal.style.display = 'flex';
    }

    function toggleModalFields() {
        const type = document.getElementById('m-type').value;
        if (type === 'mating') {
            document.getElementById('dob-group').style.display = 'none'; document.getElementById('dom-group').style.display = 'block';
            document.getElementById('sub-label').innerText = "Mating 일련세트 번호 (예: 52)";
        } else {
            document.getElementById('dob-group').style.display = 'block'; document.getElementById('dom-group').style.display = 'none';
            document.getElementById('sub-label').innerText = "Genotype 번호 또는 마리수";
        }
    }

    function closeModal() { modal.style.display = 'none'; dragData.id = null; }

    function saveCage() {
        const id = document.getElementById('m-id').value;
        const info = {
            type: document.getElementById('m-type').value, code: document.getElementById('m-code').value.toUpperCase(),
            subId: document.getElementById('m-sub').value, female: parseInt(document.getElementById('m-female').value) || 0,
            male: parseInt(document.getElementById('m-male').value) || 0, dob: document.getElementById('m-dob').value,
            dom: document.getElementById('m-dom').value, notes: document.getElementById('m-notes').value
        };
        if (id) { Object.assign(cages.find(x => x.id === id), info); } 
        else { cages.push({ id: 'c_' + Date.now(), rackId: currentRack, cellIdx: targetSlotIdxForCreate, ...info }); }
        closeModal(); renderMainBoard(); buildLeftSidebar();
    }

    function deleteCage() {
        const targetId = document.getElementById('m-id').value;
        cages = cages.filter(c => c.id !== targetId);
        if (dragData.id === targetId) dragData.id = null;
        closeModal(); renderMainBoard(); buildLeftSidebar();
    }

    function toggleMatchPanel() { document.getElementById('match-panel').classList.toggle('open'); }
    function openMatchPanel(e) {
        e.stopPropagation();
        const listContainer = document.getElementById('mapping-list'); listContainer.innerHTML = '';
        for(const [key, val] of Object.entries(STRAIN_MAP)) {
            const row = document.createElement('div'); row.className = 'match-row';
            row.innerHTML = `<span class="match-key">${key}</span><input type="text" class="match-val" value="${val}">`;
            listContainer.appendChild(row);
        }
        document.getElementById('match-panel').classList.add('open');
    }

    function updateStatsBar() {
        const total = Object.values(RACK_ROWS).reduce((a,b)=>a+b, 0) * 7;
        const currentCount = cages.length;
        const rate = total > 0 ? Math.round((currentCount / total) * 100) : 0;
        document.getElementById('occupancy-label').innerText = `${rate}% (${currentCount}/${total} 칸)`;
        document.getElementById('occupancy-bar').style.width = `${rate}%`;
    }

    buildLeftSidebar();
    renderMainBoard();
</script>
</body>
</html>
