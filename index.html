<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Rack OS v8.0 - Absolute Precision Pro</title>
    <style>
        /* --- 1. Apple 프리미엄 테크 UI 테마 정의 (글래스모피즘) --- */
        :root {
            --breeding-color: #ffffff;
            --mating-color: #ffd60a;
            --glass-panel: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --slot-bg: rgba(255, 255, 255, 0.02);
            --slot-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #8e8e93;
        }

        body {
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: radial-gradient(circle at 50% 30%, #1e1e2f, #000000 85%);
            color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }

        header {
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(40px);
            box-sizing: border-box; height: 65px;
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 700; background: linear-gradient(90deg, #fff, #a1a1a6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .top-right { display: flex; align-items: center; gap: 20px; }
        .progress-container { width: 180px; background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff9500, #ffcc00); width: 0%; transition: width 0.3s; }
        .progress-text { font-size: 13px; color: var(--text-sub); font-weight: 600; }
        
        .header-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: white; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .header-btn:hover { background: rgba(255,255,255,0.15); }

        /* --- 2. 메인 워크스페이스 구조 --- */
        .workspace { flex: 1; display: flex; overflow: hidden; }

        /* 왼쪽 사이드바: 랙 구성 및 공간 도면 내비게이터 */
        .map-nav {
            width: 300px; border-right: 1px solid var(--glass-border); padding: 25px 20px;
            display: flex; flex-direction: column; gap: 20px; background: rgba(0,0,0,0.3); overflow-y: auto;
        }
        .section-title { font-size: 13px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        
        .config-box { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px; }
        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .config-row:last-child { margin-bottom: 0; }
        .config-input { width: 50px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px; border-radius: 6px; text-align: center; }

        /* 🗺️ 동물실 실제 배치 도면 (Dropzone 역할 통합) */
        /* 🗺️ 동물실 실제 배치 도면 (컨테이너 전체 배치 및 높이 확장) */
        .room-map {
            position: relative;
            width: 100%;
            height: 360px; /* 💡 수정됨: 하단 영역 랙들을 수용하기 위해 높이를 넉넉히 확보 (290px -> 360px) */
            margin-top: auto; /* 💡 수정됨: 도면 컨테이너 자체를 사이드바 하단에 정렬 */
            margin-bottom: 0;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-sizing: border-box;
            overflow: hidden; /* 도면 박스 밖으로 나가는 요소 숨김 */
        }

        /* --- 💡 도면 내 요소 정밀 배치 좌표 --- */
        
        .map-rack {
            position: absolute; /* 💡 필수: 컨테이너(room-map)를 기준으로 절대 좌표 배치. 뒤에 relative 오타를 반드시 지워주세요! */
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s;
            /* 💣 오타 주의: 여기에 position: relative; 를 절대 넣지 마세요! 이 한 줄이 도면을 망쳤습니다. */
        }
        .map-rack.active { border-color: #ffcc00; background: rgba(255, 204, 0, 0.08); box-shadow: 0 0 15px rgba(255,204,0,0.2); }
        .map-rack h3 { margin: 0 0 5px 0; font-size: 16px; font-weight: 600; }
        .map-rack p { margin: 0; font-size: 12px; color: var(--text-sub); }
        .map-rack.drag-over { background: rgba(52, 199, 89, 0.15); border-color: #34c759; transform: scale(1.03); }
        /* --- 💡 도면 내 요소 정밀 배치 좌표 수정 --- */

        /* 1행: A (좌), B (우) - 상단 고정 */
        .rack-A { top: 15px; left: 15px; width: 80px; height: 110px; }
        .rack-B { top: 15px; right: 15px; width: 80px; height: 110px; }
        
        /* 2행: C (좌) 🟢 이 부분이 수정되었습니다. Change Station과 나란히 배치 */
        .rack-C { top: 140px; left: 15px; width: 80px; height: 110px; }

        /* 2행: Change Station (우) */
        .change-station {
            position: absolute; top: 140px; right: 15px; width: 80px; height: 110px;
            border: 1px dashed rgba(255,255,255,0.12); background: rgba(255,255,255,0.01);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: var(--text-sub); text-align: center; line-height: 1.4; font-weight: 600;
        }
        
        /* 3행, 4행: D, E - 하단 가로 배치 (왼쪽 여백 확보 및 너비 축소) */
        /* left를 85px로 늘려 왼쪽 공간을 비우고, 너비를 180px 정도로 고정합니다. */
        .rack-D { top: 265px; left: 85px; width: 180px; height: 32px; }
        .rack-E { top: 310px; left: 85px; width: 180px; height: 32px; }
        /* 오른쪽: 메인 격자 보드 */
        .board-pane { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; overflow: auto; box-sizing: border-box; }
        .board-header { margin-bottom: 20px; }
        .board-title { font-size: 26px; font-weight: 700; margin: 0; }
        .board-desc { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        .grid-container {
            background: var(--glass-panel); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 32px; padding: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative; width: fit-content;
        }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 92px); gap: 14px; position: relative; }

        /* --- 3. 정밀 정렬 슬롯 및 프리미엄 그라데이션 케이지 객체 --- */
        .slot {
            width: 92px; height: 92px; border-radius: 24px; background: var(--slot-bg);
            border: 1px dashed var(--slot-border); position: relative;
            display: flex; align-items: center; justify-content: center; box-sizing: border-box;
        }
        .slot::before { content: attr(data-label); font-size: 11px; color: rgba(255,255,255,0.1); font-weight: 600; }
        .slot.ghost-slot { border-color: rgba(255, 55, 95, 0.35); background: rgba(255, 55, 95, 0.02); }

        .cage {
            width: 92px; height: 92px; border-radius: 24px; position: absolute;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; box-shadow: 0 8px 20px rgba(0,0,0,0.3); box-sizing: border-box;
            cursor: grab; touch-action: none; z-index: 10;
            /* 💡 추가됨: 위치(left, top)가 변할 때 부드럽게 미끄러지는 효과 */
            transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        /* 💡 수정됨: bg 대신 color 변수를 매칭하여 색상이 정상 적용되게 함 */
        /* --- 메탈릭 그라데이션 케이지 효과 --- */
        .cage.breeding { 
            /* 실버/알루미늄 메탈 (흰색 베이스) */
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f5 35%, #d1d1d6 50%, #e5e5ea 65%, #ffffff 100%);
            color: #1c1c1e; 
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #a1a1a6; /* 하단 엣지 음영 */
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), /* 상단 내부 광택 */
                        0 5px 15px rgba(255, 255, 255, 0.05), 
                        0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .cage.mating { 
            /* 프리미엄 골드 메탈 (노란색 베이스) */
            background: linear-gradient(135deg, #ffeb66 0%, #ffd60a 35%, #e0b400 50%, #ffd60a 65%, #ffdf33 100%);
            color: #1c1c1e; 
            border: 1px solid rgba(255, 235, 102, 0.9);
            border-bottom: 2px solid #b38e00; /* 하단 엣지 음영 */
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), /* 상단 내부 광택 */
                        0 5px 15px rgba(255, 214, 10, 0.1), 
                        0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        /* ⭐️ [이격 버그 원천 차단] 1:1 정밀 포인터 고정 트래킹 엔진 전용 스타일 */
        .cage.floating {
            cursor: grabbing; z-index: 9999 !important;
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
            pointer-events: none;
            position: fixed !important;
            left: 0; top: 0; margin: 0 !important;
            /* 💡 추가됨: 마우스로 끌고 다닐 때는 부드러운 효과를 꺼야 포인터를 늦지 않게 따라갑니다. */
            transition: none !important; 
        }

        .strain-code { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; }
        .sub-id { font-size: 12px; font-weight: 700; margin-top: 5px; background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 6px; }

        /* --- 4. 오버레이 우측 판넬 (외부 클릭 자동 닫기) --- */
        .side-panel {
            position: fixed; top: 0; right: -360px; width: 330px; height: 100vh;
            background: rgba(25, 25, 30, 0.85); backdrop-filter: blur(40px); border-left: 1px solid var(--glass-border);
            z-index: 1500; padding: 40px 25px; box-shadow: -20px 0 40px rgba(0,0,0,0.5);
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-sizing: border-box;
        }
        .side-panel.open { right: 0; }
        .side-panel h2 { font-size: 22px; margin-top: 0; margin-bottom: 25px; }
        
        .match-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .match-key { width: 40px; text-align: center; font-weight: bold; font-size: 16px; color: #ffcc00; }
        .match-val { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 8px; border-radius: 8px; }

        /* --- 5. 정보 수정 모달 창 --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000;
            display: none; justify-content: center; align-items: center;
        }
        .modal {
            background: rgba(28, 28, 35, 0.95); border: 1px solid var(--glass-border); border-radius: 28px;
            width: 440px; padding: 35px; box-shadow: 0 40px 80px rgba(0,0,0,0.6); box-sizing: border-box;
        }
        .modal h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; font-weight: 600; }
        .form-control {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3); color: white; font-size: 14px; box-sizing: border-box;
        }
        .form-row { display: flex; gap: 10px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px; }
        .btn { padding: 12px 18px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-save { background: #ffcc00; color: #1c1c1e; }
        .btn-delete { background: #FF375F; color: white; margin-right: auto; }
    </style>
</head>
<body>

<header>
    <h1>Smart Rack OS <span style="font-size:14px; color:var(--mating-color); font-weight:bold; margin-left:6px;">v8.0 Absolute Precision</span></h1>
    <div class="top-right">
        <div class="progress-text">공간 사용률: <span id="occupancy-label">0%</span></div>
        <div class="progress-container"><div class="progress-bar" id="occupancy-bar"></div></div>
        <button class="header-btn" onclick="openMatchPanel(event)">🧬 Strain 매칭표 편집</button>
    </div>
</header>

<div class="workspace">
    <div class="map-nav">
        <div class="section-title">랙 줄 수 세부 설정</div>
        <div class="config-box" id="config-box"></div>
        
        <div style="border-bottom: 1px solid var(--glass-border); margin: 5px 0;"></div>
        <div class="section-title">연구실 배치 도면 (클릭하여 전환)</div>
        
        <div class="room-map" id="room-map">
            <div class="map-rack rack-A" data-rack="A" id="map-A">A</div>
            <div class="map-rack rack-B" data-rack="B" id="map-B">B</div>
            <div class="map-rack rack-C" data-rack="C" id="map-C">C</div>
            <div class="map-rack rack-D" data-rack="D" id="map-D">D</div>
            <div class="map-rack rack-E" data-rack="E" id="map-E">E</div>
            <div class="change-station">Change<br>Station</div>
        </div>
    </div>

    <div class="board-pane">
        <div class="board-header">
            <h2 class="board-title" id="current-rack-title">Rack A</h2>
            <div class="board-desc" id="current-rack-desc">계산 중...</div>
        </div>
        
        <div class="grid-container">
            <div class="grid-7" id="main-grid"></div>
        </div>
    </div>
</div>

<div class="side-panel" id="match-panel">
    <h2>🧬 Strain 기호 커스텀</h2>
    <p style="font-size:12px; color:var(--text-sub); margin-bottom:20px;">기호 알파벳과 Strain 명칭을 실시간으로 수정하세요.</p>
    <div id="mapping-list"></div>
    <button class="header-btn" style="width:100%; margin-top:30px; background:#ffcc00; color:#1c1c1e;" onclick="toggleMatchPanel()">설정 완료 및 닫기</button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modal-title">케이지 관리</h2>
        <input type="hidden" id="m-id">
        
        <div class="form-group">
            <label>용도 구분</label>
            <select id="m-type" class="form-control" onchange="toggleModalFields()">
                <option value="breeding">Breeding (생산용 - 흰색)</option>
                <option value="mating">Mating (교배용 - 노란색)</option>
            </select>
        </div>
        <div class="form-row">
            <div class="form-group" style="flex:1;">
                <label>표시 알파벳 기호</label>
                <input type="text" id="m-code" class="form-control" placeholder="예: A, C">
            </div>
            <div class="form-group" style="flex:1;">
                <label id="sub-label">서브 번호/마리수</label>
                <input type="text" id="m-sub" class="form-control" placeholder="A52형태 자동 연산">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group" style="flex:1;">
                <label>암컷 수 (♀)</label>
                <input type="number" id="m-female" class="form-control" value="0" min="0">
            </div>
            <div class="form-group" style="flex:1;">
                <label>수컷 수 (♂)</label>
                <input type="number" id="m-male" class="form-control" value="0" min="0">
            </div>
        </div>
        <div class="form-group" id="dob-group">
            <label>DOB (출생일)</label>
            <input type="date" id="m-dob" class="form-control">
        </div>
        <div class="form-group" id="dom-group">
            <label>DOM (교배일)</label>
            <input type="date" id="m-dom" class="form-control">
        </div>
        <div class="form-group">
            <label>특이사항 (Notes)</label>
            <textarea id="m-notes" class="form-control" rows="2"></textarea>
        </div>
        
        <div class="modal-btns">
            <button class="btn btn-delete" id="btn-delete" onclick="deleteCage()">삭제</button>
            <button class="btn btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn btn-save" onclick="saveCage()">적용</button>
        </div>
    </div>
</div>

<script>
   let RACK_ROWS = { 'A': 5, 'B': 5, 'C': 5, 'D': 3, 'E': 3 };
    let currentRack = 'A';
    let STRAIN_MAP = { 'A': 'K18-hACE2', 'C': 'Aim2', 'W': 'Wild Type' };

    let cages = [
        { id: 'm1', rackId: 'A', cellIdx: 0, type: 'mating', code: 'A', subId: '51', female: 2, male: 1 },
        { id: 'm2', rackId: 'A', cellIdx: 1, type: 'mating', code: 'A', subId: '52', female: 1, male: 1 },
        { id: 'm3', rackId: 'A', cellIdx: 2, type: 'mating', code: 'A', subId: '53', female: 2, male: 1 },
        { id: 'm4', rackId: 'A', cellIdx: 3, type: 'mating', code: 'A', subId: '54', female: 2, male: 1 },
        { id: 'm5', rackId: 'B', cellIdx: 0, type: 'mating', code: 'A', subId: '55', female: 1, male: 1 },
        { id: 'm6', rackId: 'B', cellIdx: 1, type: 'mating', code: 'A', subId: '56', female: 1, male: 1 },
        { id: 'm7', rackId: 'C', cellIdx: 5, type: 'mating', code: 'A', subId: '57', female: 2, male: 1 },
        { id: 'm8', rackId: 'C', cellIdx: 6, type: 'mating', code: 'A', subId: '58', female: 2, male: 1 },
        { id: 'm9', rackId: 'D', cellIdx: 4, type: 'mating', code: 'A', subId: '59', female: 1, male: 1 },
        { id: 'm10', rackId: 'E', cellIdx: 4, type: 'mating', code: 'A', subId: '60', female: 1, male: 1 },
        { id: 'b1', rackId: 'A', cellIdx: 4, type: 'breeding', code: 'C', subId: '5마리', female: 5, male: 0 },
        { id: 'b2', rackId: 'A', cellIdx: 5, type: 'breeding', code: 'C', subId: 'C10', female: 3, male: 2 },
        { id: 'b3', rackId: 'A', cellIdx: 6, type: 'breeding', code: 'C', subId: 'C11', female: 4, male: 0 },
        { id: 'b4', rackId: 'B', cellIdx: 10, type: 'breeding', code: 'C', subId: '3마리', female: 0, male: 3 },
        { id: 'b5', rackId: 'B', cellIdx: 11, type: 'breeding', code: 'C', subId: '4마리', female: 2, male: 2 },
        { id: 'b6', rackId: 'C', cellIdx: 0, type: 'breeding', code: 'C', subId: 'C12', female: 5, male: 0 },
        { id: 'b7', rackId: 'C', cellIdx: 1, type: 'breeding', code: 'C', subId: 'C13', female: 3, male: 0 },
        { id: 'b8', rackId: 'D', cellIdx: 0, type: 'breeding', code: 'C', subId: '2마리' },
        { id: 'b9', rackId: 'D', cellIdx: 1, type: 'breeding', code: 'C', subId: 'C14', female: 4, male: 0 },
        { id: 'b10', rackId: 'E', cellIdx: 0, type: 'breeding', code: 'C', subId: '5마리', female: 2, male: 3 }
    ];

    let dragData = { id: null, active: false, el: null, shiftX: 0, shiftY: 0 };
    let currentHoverIdx = -1; // 현재 마우스가 올라가 있는 그리드 칸 번호

    function setupDragEngine(cageEl, cageId) {
        cageEl.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return; 
            e.preventDefault();
            
            dragData.id = cageId;
            dragData.active = true;
            dragData.el = cageEl;
            
            const rect = cageEl.getBoundingClientRect();
            dragData.shiftX = e.clientX - rect.left;
            dragData.shiftY = e.clientY - rect.top;

            document.body.appendChild(cageEl);
            cageEl.classList.add('floating');
            cageEl.style.width = rect.width + 'px';
            cageEl.style.height = rect.height + 'px';
            cageEl.style.transformOrigin = `${dragData.shiftX}px ${dragData.shiftY}px`;
            
            moveAt(e.clientX, e.clientY);
            
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
        });
    }

    function onPointerMove(e) {
        if (!dragData.active) return;
        moveAt(e.clientX, e.clientY);

        // 1. 도면 위를 맴돌 때 랙 자동 전환 기능 (Hover to Switch)
        let hoveredRack = null;
        document.querySelectorAll('.map-rack').forEach(rackEl => {
            const r = rackEl.getBoundingClientRect();
            if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
                rackEl.classList.add('drag-over');
                hoveredRack = rackEl.dataset.rack;
            } else {
                rackEl.classList.remove('drag-over');
            }
        });

        if (hoveredRack && hoveredRack !== currentRack) {
            currentRack = hoveredRack;
            renderMainBoard(); 
            buildLeftSidebar();
        }

        // 2. 놓을 위치를 미리 계산해서 비켜주는 애니메이션 연산
        let minD = 9999;
        let hoverIdx = -1;
        document.querySelectorAll('#main-grid .slot').forEach(slot => {
            const r = slot.getBoundingClientRect();
            const d = Math.hypot((r.left + r.width/2) - e.clientX, (r.top + r.height/2) - e.clientY);
            // 마우스가 슬롯 중심에서 55px 이내로 들어오면 타겟으로 인식
            if (d < minD && d < 55) { minD = d; hoverIdx = parseInt(slot.dataset.idx); }
        });
        previewShift(hoverIdx);
    }

    function moveAt(x, y) {
        dragData.el.style.left = (x - dragData.shiftX) + 'px';
        dragData.el.style.top = (y - dragData.shiftY) + 'px';
    }

    // ⭐️ 핵심 기능: 자리를 비켜주는 시각적 애니메이션 처리 함수
    function previewShift(targetIdx) {
        if (currentHoverIdx === targetIdx) return; // 동일한 칸이면 재계산 방지
        currentHoverIdx = targetIdx;

        const grid = document.getElementById('main-grid');
        const slots = grid.querySelectorAll('.slot');
        
        // 드래그 중인 케이지를 제외한 현재 랙의 복사본 생성
        let simCages = cages.filter(c => c.rackId === currentRack && c.id !== dragData.id).map(c => ({...c}));
        
        // 겹치는 자리에 누군가 있다면 뒤로 쭈욱 밀어내는 연산
        if (targetIdx !== -1) {
            const occupant = simCages.find(c => c.cellIdx === targetIdx);
            if (occupant) {
                let capacity = RACK_ROWS[currentRack] * 7;
                let firstEmpty = -1;
                for (let i = targetIdx; i < capacity + 50; i++) {
                    if (!simCages.some(c => c.cellIdx === i)) { firstEmpty = i; break; }
                }
                simCages.forEach(c => {
                    if (c.cellIdx >= targetIdx && c.cellIdx < firstEmpty) { c.cellIdx += 1; }
                });
            }
        }

        // 연산된 임시 위치를 DOM에 즉시 적용 (CSS Transition이 부드럽게 밀어줌)
        simCages.forEach(cage => {
            const el = document.getElementById(cage.id);
            const targetSlot = slots[cage.cellIdx];
            if (el && targetSlot) {
                el.style.left = targetSlot.offsetLeft + 'px';
                el.style.top = targetSlot.offsetTop + 'px';
            }
        });
    }

    function onPointerUp(e) {
        if (!dragData.active) return;
        dragData.active = false;
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);

        // 드래그 종료 시 임시 밀어내기 효과 초기화
        previewShift(-1); 
        
        dragData.el.classList.remove('floating');
        dragData.el.remove(); // body에서 분리

        if (currentHoverIdx !== -1) {
            // 마우스가 올려져 있던 최종 슬롯에 안착
            executeSmartShift(dragData.id, currentRack, currentHoverIdx);
        } else {
            // 엉뚱한 곳에 놓으면 원래 자리로 원상복구
            renderMainBoard();
        }
        
        // 도면 효과 초기화
        document.querySelectorAll('.map-rack').forEach(el => el.classList.remove('drag-over'));
    }

    // 데이터 영구 저장 및 확정
    function executeSmartShift(cageId, targetRack, targetIdx) {
        const item = cages.find(c => c.id === cageId);
        if (item.rackId === targetRack && item.cellIdx === targetIdx) { renderMainBoard(); return; }

        const occupant = cages.find(c => c.rackId === targetRack && c.cellIdx === targetIdx && c.id !== cageId);
        if (occupant) {
            let capacity = RACK_ROWS[targetRack] * 7;
            let firstEmpty = -1;
            for (let i = targetIdx; i < capacity + 50; i++) {
                if (!cages.some(c => c.rackId === targetRack && c.cellIdx === i && c.id !== cageId)) {
                    firstEmpty = i; break;
                }
            }
            cages.forEach(c => {
                if (c.rackId === targetRack && c.id !== cageId && c.cellIdx >= targetIdx && c.cellIdx < firstEmpty) {
                    c.cellIdx += 1;
                }
            });
        }
        item.rackId = targetRack;
        item.cellIdx = targetIdx;
        renderMainBoard();
        buildLeftSidebar();
    }

    // ⭐️ 화면 재생성 최적화: 기존 요소를 파괴하지 않고 위치만 업데이트
    function renderMainBoard() {
        const grid = document.getElementById('main-grid');
        document.getElementById('current-rack-title').innerText = `Rack ${currentRack}`;
        
        const baseCapacity = RACK_ROWS[currentRack] * 7;
        const currentCages = cages.filter(c => c.rackId === currentRack);
        const maxIdx = currentCages.reduce((max, c) => Math.max(max, c.cellIdx), baseCapacity - 1);
        const totalCapacity = maxIdx + 1;

        document.getElementById('current-rack-desc').innerText = `${RACK_ROWS[currentRack]}행 × 7열 (${baseCapacity}칸 내부 정원)`;

        // 1. 기존 슬롯 지우기 (케이지는 남겨둠)
        Array.from(grid.children).forEach(child => {
            if (child.classList.contains('slot')) child.remove();
        });

        // 2. 새로운 슬롯 깔기 (가장 밑바닥에 삽입)
        let slotsFragment = document.createDocumentFragment();
        for (let i = 0; i < totalCapacity; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot' + (i >= baseCapacity ? ' ghost-slot' : '');
            const rChar = String.fromCharCode(64 + Math.floor(i / 7) + 1);
            slot.setAttribute('data-label', `${rChar}-${(i % 7) + 1}`);
            slot.dataset.idx = i;
            slot.onclick = () => openModal(null, i);
            slotsFragment.appendChild(slot);
        }
        grid.prepend(slotsFragment);

        const slots = grid.querySelectorAll('.slot');
        const currentCageIds = currentCages.map(c => c.id);

        // 3. 다른 랙으로 떠났거나 삭제된 케이지 제거
        Array.from(grid.querySelectorAll('.cage')).forEach(el => {
            if (!currentCageIds.includes(el.id) && el.id !== dragData.id) {
                el.remove();
            }
        });

        // 4. 케이지 생성 및 부드러운 위치 이동
        currentCages.forEach(cage => {
            if (dragData.active && cage.id === dragData.id) return; // 드래그 중인 본체는 무시

            let el = document.getElementById(cage.id);
            if (!el) {
                // 화면에 없는 케이지라면 새로 생성
                el = document.createElement('div');
                el.id = cage.id;
                el.className = `cage ${cage.type}`;
                let displaySub = cage.type === 'mating' ? cage.code + cage.subId : cage.subId;
                if (cage.type === 'mating') {
                    el.innerHTML = `<span class="strain-code" style="font-size:24px; letter-spacing:-1px;">${displaySub}</span>`;
                } else {
                    el.innerHTML = `<span class="strain-code">${cage.code}</span><span class="sub-id">${displaySub}</span>`;
                }
                el.onclick = (e) => { e.stopPropagation(); openModal(cage.id); };
                setupDragEngine(el, cage.id);
                grid.appendChild(el);
            }

            // 약간의 딜레이를 주어 CSS Transition이 발동하게 만듦
            setTimeout(() => {
                const targetSlot = slots[cage.cellIdx];
                if (targetSlot) {
                    el.style.left = targetSlot.offsetLeft + 'px';
                    el.style.top = targetSlot.offsetTop + 'px';
                }
            }, 10);
        });
        updateStatsBar();
    }

    function buildLeftSidebar() {
        const configBox = document.getElementById('config-box');
        configBox.innerHTML = '';
        for (const [rName, rows] of Object.entries(RACK_ROWS)) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'config-row';
            rowDiv.innerHTML = `
                <span>Rack ${rName} 세로 줄 수</span>
                <input type="number" class="config-input" value="${rows}" min="1" max="10" data-rack="${rName}">
            `;
            rowDiv.querySelector('input').onchange = (e) => {
                RACK_ROWS[e.target.dataset.rack] = parseInt(e.target.value);
                renderMainBoard();
                buildLeftSidebar();
            };
            configBox.appendChild(rowDiv);
        }

        document.querySelectorAll('.map-rack').forEach(rackEl => {
            const rackName = rackEl.dataset.rack;
            rackEl.onclick = () => { 
                currentRack = rackName; 
                buildLeftSidebar(); 
                renderMainBoard(); 
            };
            if(rackName === currentRack) rackEl.classList.add('active');
            else rackEl.classList.remove('active');
        });
    }

    const modal = document.getElementById('modal');
    let targetSlotIdxForCreate = null;

    function openModal(cageId, slotIdx = null) {
        if (cageId) {
            const c = cages.find(x => x.id === cageId);
            document.getElementById('modal-title').innerText = "케이지 데이터 편집";
            document.getElementById('m-id').value = c.id;
            document.getElementById('m-type').value = c.type;
            document.getElementById('m-code').value = c.code;
            document.getElementById('m-sub').value = c.subId;
            document.getElementById('m-female').value = c.female !== undefined ? c.female : 0;
            document.getElementById('m-male').value = c.male !== undefined ? c.male : 0;
            document.getElementById('m-dob').value = c.dob || "";
            document.getElementById('m-dom').value = c.dom || "";
            document.getElementById('m-notes').value = c.notes || "";
            document.getElementById('btn-delete').style.display = 'block';
        } else {
            targetSlotIdxForCreate = slotIdx;
            document.getElementById('modal-title').innerText = `신규 등록 (Rack ${currentRack})`;
            document.getElementById('m-id').value = "";
            document.getElementById('m-type').value = "breeding";
            document.getElementById('m-code').value = "";
            document.getElementById('m-sub').value = "";
            document.getElementById('m-female').value = 0;
            document.getElementById('m-male').value = 0;
            document.getElementById('m-dob').value = "";
            document.getElementById('m-dom').value = "";
            document.getElementById('m-notes').value = "";
            document.getElementById('btn-delete').style.display = 'none';
        }
        toggleModalFields();
        modal.style.display = 'flex';
    }

    function toggleModalFields() {
        const type = document.getElementById('m-type').value;
        if (type === 'mating') {
            document.getElementById('dob-group').style.display = 'none';
            document.getElementById('dom-group').style.display = 'block';
            document.getElementById('sub-label').innerText = "Mating 일련세트 번호 (예: 52)";
        } else {
            document.getElementById('dob-group').style.display = 'block';
            document.getElementById('dom-group').style.display = 'none';
            document.getElementById('sub-label').innerText = "Genotype 번호 또는 마리수";
        }
    }

    function closeModal() { modal.style.display = 'none'; }

    function saveCage() {
        const id = document.getElementById('m-id').value;
        const info = {
            type: document.getElementById('m-type').value,
            code: document.getElementById('m-code').value.toUpperCase(),
            subId: document.getElementById('m-sub').value,
            female: parseInt(document.getElementById('m-female').value) || 0,
            male: parseInt(document.getElementById('m-male').value) || 0,
            dob: document.getElementById('m-dob').value,
            dom: document.getElementById('m-dom').value,
            notes: document.getElementById('m-notes').value
        };

        if (id) { Object.assign(cages.find(x => x.id === id), info); } 
        else { cages.push({ id: 'c_' + Date.now(), rackId: currentRack, cellIdx: targetSlotIdxForCreate, ...info }); }
        
        closeModal(); renderMainBoard(); buildLeftSidebar();
    }

    function deleteCage() {
        cages = cages.filter(c => c.id !== document.getElementById('m-id').value);
        closeModal(); renderMainBoard(); buildLeftSidebar();
    }

    function toggleMatchPanel() { document.getElementById('match-panel').classList.toggle('open'); }

    function openMatchPanel(e) {
        e.stopPropagation();
        const listContainer = document.getElementById('mapping-list');
        listContainer.innerHTML = '';
        for(const [key, val] of Object.entries(STRAIN_MAP)) {
            const row = document.createElement('div');
            row.className = 'match-row';
            row.innerHTML = `<span class="match-key">${key}</span><input type="text" class="match-val" value="${val}">`;
            listContainer.appendChild(row);
        }
        document.getElementById('match-panel').classList.add('open');
    }

    function updateStatsBar() {
        const total = Object.values(RACK_ROWS).reduce((a,b)=>a+b, 0) * 7;
        const currentCount = cages.length;
        const rate = total > 0 ? Math.round((currentCount / total) * 100) : 0;
        document.getElementById('occupancy-label').innerText = `${rate}% (${currentCount}/${total} 칸)`;
        document.getElementById('occupancy-bar').style.width = `${rate}%`;
    }

    buildLeftSidebar();
    renderMainBoard();
    </script>

</body>
