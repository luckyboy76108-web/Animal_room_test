<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Rack OS v8.5 - Absolute Precision Pro</title>
    <style>
        :root {
            --breeding-color: #ffffff;
            --mating-color: #ffd60a;
            --glass-panel: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --slot-bg: rgba(255, 255, 255, 0.02);
            --slot-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #8e8e93;
        }

        body {
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: radial-gradient(circle at 50% 30%, #1e1e2f, #000000 85%);
            color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }

        header {
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(40px);
            box-sizing: border-box; height: 65px;
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 700; background: linear-gradient(90deg, #fff, #a1a1a6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .top-right { display: flex; align-items: center; gap: 20px; }
        .progress-container { width: 180px; background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff9500, #ffcc00); width: 0%; transition: width 0.3s; }
        .progress-text { font-size: 13px; color: var(--text-sub); font-weight: 600; }
        
        .header-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: white; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .header-btn:hover { background: rgba(255,255,255,0.15); }
        .header-btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

        .workspace { flex: 1; display: flex; overflow: hidden; }

        .map-nav {
            width: 300px; border-right: 1px solid var(--glass-border); padding: 25px 20px;
            display: flex; flex-direction: column; gap: 20px; background: rgba(0,0,0,0.3); overflow-y: auto;
        }
        .section-title { font-size: 13px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        
        .config-box { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px; }
        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .config-row:last-child { margin-bottom: 0; }
        .config-input { width: 50px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px; border-radius: 6px; text-align: center; }

        .room-map {
            position: relative; width: 100%; height: 360px;
            margin-top: auto; margin-bottom: 0;
            background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            border-radius: 24px; box-sizing: border-box; overflow: hidden;
        }

        .map-rack {
            position: absolute;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .map-rack.active { border-color: #ffcc00; background: rgba(255, 204, 0, 0.08); box-shadow: 0 0 15px rgba(255,204,0,0.2); }
        .map-rack h3 { margin: 0 0 5px 0; font-size: 16px; font-weight: 600; }
        .map-rack p { margin: 0; font-size: 12px; color: var(--text-sub); }
        .map-rack.drag-over { background: rgba(52, 199, 89, 0.15); border-color: #34c759; transform: scale(1.03); }

        .rack-A { top: 15px; left: 15px; width: 80px; height: 110px; }
        .rack-B { top: 15px; right: 15px; width: 80px; height: 110px; }
        .rack-C { top: 140px; left: 15px; width: 80px; height: 110px; }
        .change-station {
            position: absolute; top: 140px; right: 15px; width: 80px; height: 110px;
            border: 1px dashed rgba(255,255,255,0.12); background: rgba(255,255,255,0.01);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: var(--text-sub); text-align: center; line-height: 1.4; font-weight: 600;
        }
        .rack-D { top: 265px; left: 85px; width: 180px; height: 32px; }
        .rack-E { top: 310px; left: 85px; width: 180px; height: 32px; }

        .board-pane { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; overflow: auto; box-sizing: border-box; }
        .board-header { margin-bottom: 20px; }
        .board-title { font-size: 26px; font-weight: 700; margin: 0; }
        .board-desc { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        .grid-container {
            background: var(--glass-panel); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 32px; padding: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative; width: fit-content;
        }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 92px); gap: 14px; position: relative; }

        .slot {
            width: 92px; height: 92px; border-radius: 24px; background: var(--slot-bg);
            border: 1px dashed var(--slot-border); position: relative;
            display: flex; align-items: center; justify-content: center; box-sizing: border-box;
        }
        .slot::before { content: attr(data-label); font-size: 11px; color: rgba(255,255,255,0.1); font-weight: 600; }
        .slot.ghost-slot { border-color: rgba(255, 55, 95, 0.35); background: rgba(255, 55, 95, 0.02); }

        .cage {
            width: 92px; height: 92px; border-radius: 24px; position: absolute;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; box-shadow: 0 8px 20px rgba(0,0,0,0.3); box-sizing: border-box;
            cursor: grab; touch-action: none; z-index: 10;
            transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .cage.breeding { 
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f5 35%, #d1d1d6 50%, #e5e5ea 65%, #ffffff 100%);
            color: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #a1a1a6;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 5px 15px rgba(255, 255, 255, 0.05), 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .cage.mating { 
            background: linear-gradient(135deg, #ffeb66 0%, #ffd60a 35%, #e0b400 50%, #ffd60a 65%, #ffdf33 100%);
            color: #1c1c1e; border: 1px solid rgba(255, 235, 102, 0.9);
            border-bottom: 2px solid #b38e00;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), 0 5px 15px rgba(255, 214, 10, 0.1), 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .cage.floating {
            cursor: grabbing; z-index: 9999 !important;
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
            pointer-events: none; position: fixed !important;
            left: 0; top: 0; margin: 0 !important;
            transition: none !important; 
        }

        .strain-code { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; }
        .sub-id { font-size: 12px; font-weight: 700; margin-top: 5px; background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 6px; }

        .side-panel {
            position: fixed; top: 0; right: -360px; width: 330px; height: 100vh;
            background: rgba(25, 25, 30, 0.85); backdrop-filter: blur(40px); border-left: 1px solid var(--glass-border);
            z-index: 1500; padding: 40px 25px; box-shadow: -20px 0 40px rgba(0,0,0,0.5);
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-sizing: border-box; overflow-y: auto;
        }
        .side-panel.open { right: 0; }
        .side-panel h2 { font-size: 22px; margin-top: 0; margin-bottom: 25px; }
        .match-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000;
            display: none; justify-content: center; align-items: center;
        }
        /* 💡 수정됨: 모달 높이 제한 및 스크롤 디자인 추가 */
        .modal {
            background: rgba(28, 28, 35, 0.95); border: 1px solid var(--glass-border); border-radius: 28px;
            width: 440px; max-height: 90vh; overflow-y: auto; padding: 35px; box-shadow: 0 40px 80px rgba(0,0,0,0.6); box-sizing: border-box;
        }
        .modal::-webkit-scrollbar { width: 6px; }
        .modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        
        .modal h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; font-weight: 600; }
        .form-control {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3); color: white; font-size: 14px; box-sizing: border-box;
        }
        .form-row { display: flex; gap: 10px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px; }
        .btn { padding: 12px 18px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-save { background: #ffcc00; color: #1c1c1e; }
        .btn-delete { background: #FF375F; color: white; margin-right: auto; }

        .btn-today {
            background: rgba(10, 132, 255, 0.15); color: #0a84ff; border: 1px solid rgba(10, 132, 255, 0.3);
            border-radius: 8px; padding: 0 10px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-today:hover { background: #0a84ff; color: white; }

        #selection-marquee {
            position: fixed; display: none; z-index: 9999; pointer-events: none;
            background: rgba(10, 132, 255, 0.2); border: 1px solid rgba(10, 132, 255, 0.8);
            border-radius: 4px; backdrop-filter: blur(2px);
        }
        .cage.selected {
            filter: brightness(0.4) saturate(1.2);
            border: 2px solid #FF375F !important;
            transform: scale(0.95); box-shadow: 0 0 15px rgba(255, 55, 95, 0.4);
        }
        .drag-badge {
            position: absolute; top: -10px; right: -10px;
            background: #FF375F; color: white; font-size: 14px; font-weight: bold;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 55, 95, 0.5); z-index: 10000;
        }
        .batch-bar {
            position: fixed; bottom: -120px; left: 50%; transform: translateX(-50%);
            background: rgba(28, 28, 35, 0.95); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 15px 25px; display: flex; align-items: center; gap: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 3000;
            transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); white-space: nowrap;
        }
        .batch-bar.show { bottom: 40px; }
        .batch-count { font-weight: 700; color: #ffcc00; font-size: 15px; letter-spacing: -0.5px; }

        .contiguous-badge {
            font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px; display: flex; align-items: center; gap: 5px;
        }
        .contiguous-badge.ok { background: rgba(52, 199, 89, 0.2); color: #34c759; border: 1px solid rgba(52,199,89,0.4); }
        .contiguous-badge.ng { background: rgba(255, 55, 95, 0.15); color: #FF375F; border: 1px solid rgba(255,55,95,0.3); }

        .btn-active {
            background: #0a84ff !important; color: white !important;
            border-color: #0a84ff !important; box-shadow: 0 0 15px rgba(10, 132, 255, 0.4);
        }
        body.batch-mode .cage { transition: filter 0.3s, transform 0.3s; }
        body.batch-mode .cage:not(.selected) { filter: brightness(0.4) opacity(0.6); transform: scale(0.95); }

        body::before {
            content: ''; position: fixed; inset: 0; z-index: 8000; pointer-events: none;
            background: repeating-linear-gradient(-45deg, rgba(255, 38, 38, 0.18) 0px, rgba(255, 38, 38, 0.18) 18px, transparent 18px, transparent 36px);
            opacity: 0; transition: opacity 0.15s ease;
        }
        body.overflow-alert::before { animation: stripeFlash 1.1s ease-in-out infinite; }
        @keyframes stripeFlash { 0%, 100% { opacity: 0; } 45%, 55% { opacity: 1; } }

        #overflow-banner {
            position: fixed; top: 65px; left: 0; right: 0; z-index: 7000;
            background: linear-gradient(90deg, #c0001a, #ff2b2b, #c0001a); background-size: 200% 100%;
            animation: bannerSlide 2.5s linear infinite; color: white; font-size: 13px; font-weight: 700;
            padding: 0 24px; height: 0; overflow: hidden; display: flex; align-items: center; justify-content: space-between;
            transition: height 0.3s cubic-bezier(0.2,0.8,0.2,1); box-shadow: 0 4px 20px rgba(255,0,0,0.4);
        }
        #overflow-banner.show { height: 42px; }
        @keyframes bannerSlide { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }
        #overflow-banner .banner-left { display: flex; align-items: center; gap: 10px; }
        #overflow-banner .banner-icon { font-size: 16px; animation: iconBlink 1.1s ease-in-out infinite; }
        @keyframes iconBlink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
        #overflow-banner .banner-racks { background: rgba(255,255,255,0.2); border-radius: 6px; padding: 2px 8px; font-size: 12px; letter-spacing: 0.5px; }
        #overflow-banner .banner-btns { display: flex; gap: 8px; }
        #overflow-banner .banner-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 4px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 700; transition: background 0.15s; }
        #overflow-banner .banner-btn:hover { background: rgba(255,255,255,0.35); }
        #overflow-banner .banner-btn.go { background: white; color: #c0001a; }
        #overflow-banner .banner-btn.go:hover { background: #ffe0e0; }

        .slot.ghost-slot { animation: ghostPulse 1.1s ease-in-out infinite; }
        @keyframes ghostPulse { 0%, 100% { border-color: rgba(255, 55, 95, 0.4); background: rgba(255, 55, 95, 0.03); } 50% { border-color: rgba(255, 55, 95, 0.9); background: rgba(255, 55, 95, 0.12); } }
        body.overflow-alert header { border-bottom-color: rgba(255,38,38,0.6); }
    </style>
</head>
<body>

<header>
    <h1>Smart Rack OS <span style="font-size:14px; color:var(--mating-color); font-weight:bold; margin-left:6px;">v8.5 Absolute Precision</span></h1>
    <div class="top-right">
        <div class="progress-text">공간 사용률: <span id="occupancy-label">0%</span></div>
        <div class="progress-container"><div class="progress-bar" id="occupancy-bar"></div></div>
        
        <button class="header-btn" id="btn-batch" onclick="toggleBatchMode()">☑️ 일괄 선택</button>
        <button class="header-btn" onclick="openMatchPanel(event)">🧬 Strain 매칭표 편집</button>
    </div>
</header>

<div class="workspace">
    <div class="map-nav">
        <div class="section-title">랙 줄 수 세부 설정</div>
        <div class="config-box" id="config-box"></div>
        <div style="border-bottom: 1px solid var(--glass-border); margin: 5px 0;"></div>
        <div class="section-title">연구실 배치 도면 (클릭하여 전환)</div>
        <div class="room-map" id="room-map">
            <div class="map-rack rack-A" data-rack="A" id="map-A">A</div>
            <div class="map-rack rack-B" data-rack="B" id="map-B">B</div>
            <div class="map-rack rack-C" data-rack="C" id="map-C">C</div>
            <div class="map-rack rack-D" data-rack="D" id="map-D">D</div>
            <div class="map-rack rack-E" data-rack="E" id="map-E">E</div>
            <div class="change-station">Change<br>Station</div>
        </div>
    </div>

    <div class="board-pane">
        <div class="board-header">
            <h2 class="board-title" id="current-rack-title">Rack A</h2>
            <div class="board-desc" id="current-rack-desc">계산 중...</div>
        </div>
        <div class="grid-container">
            <div class="grid-7" id="main-grid"></div>
        </div>
    </div>
</div>

<div class="side-panel" id="match-panel">
    <h2>🧬 Strain 기호 커스텀</h2>
    <p style="font-size:12px; color:var(--text-sub); margin-bottom:20px;">기호 알파벳과 Strain 명칭을 자유롭게 추가하고 수정하세요.</p>
    <div id="mapping-list" style="margin-bottom: 15px;"></div>
    <button class="header-btn" style="width:100%; margin-bottom:10px; background:rgba(255,255,255,0.1);" onclick="addStrainRow()">+ 기호 추가</button>
    <button class="header-btn" style="width:100%; background:#ffcc00; color:#1c1c1e;" onclick="saveAndCloseMatchPanel()">설정 완료</button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modal-title">케이지 관리</h2>
        <input type="hidden" id="m-id">
        
        <div class="form-group">
            <label>용도 구분 (Mating / Breeding)</label>
            <select id="m-type" class="form-control" onchange="toggleModalFields()">
                <option value="breeding">Breeding (생산/유지용 - 흰색)</option>
                <option value="mating">Mating (교배용 - 노란색)</option>
            </select>
        </div>
        <div class="form-row">
            <div class="form-group" style="flex:1;">
                <label>알파벳 기호</label>
                <input type="text" id="m-code" class="form-control" placeholder="A, C" oninput="updateGenotypeDisplay()" maxlength="2">
                <div id="genotype-display" style="font-size:11px; color:#ffcc00; margin-top:5px; font-weight:600;">Genotype: 매칭 안됨</div>
            </div>
            <div class="form-group" style="flex:1;">
                <label>케이지 번호</label>
                <input type="text" id="m-sub" class="form-control" placeholder="예: 52 (없으면 비움)">
            </div>
        </div>
        
        <div id="mating-fields" style="display:none; background:rgba(255,214,10,0.05); padding:15px; border-radius:12px; border:1px solid rgba(255,214,10,0.2); margin-bottom:14px;">
            <div class="form-group">
                <label>DOM (교배일)</label>
                <div style="display:flex; gap:8px;">
                    <input type="date" id="m-dom" class="form-control">
                    <button type="button" class="btn-today" onclick="setToday('m-dom')">Today</button>
                </div>
            </div>
            <div style="display:flex; gap:15px;">
                <div style="flex:1; border-right:1px solid rgba(255,255,255,0.1); padding-right:15px;">
                    <label style="color:#0a84ff; font-size:13px; margin-bottom:8px;">수컷 정보 (♂)</label>
                    <input type="number" id="m-male-count" class="form-control" placeholder="마리수" style="margin-bottom:8px;" min="0">
                    <input type="text" id="m-male-geno" class="form-control" placeholder="수컷 Genotype" style="margin-bottom:8px;">
                    <div style="display:flex; gap:5px;">
                        <input type="date" id="m-male-dob" class="form-control" style="font-size:12px; padding:8px;">
                        <button type="button" class="btn-today" onclick="setToday('m-male-dob')">T</button>
                    </div>
                </div>
                <div style="flex:1;">
                    <label style="color:#FF375F; font-size:13px; margin-bottom:8px;">암컷 정보 (♀)</label>
                    <input type="number" id="m-female-count" class="form-control" placeholder="마리수" style="margin-bottom:8px;" min="0">
                    <input type="text" id="m-female-geno" class="form-control" placeholder="암컷 Genotype" style="margin-bottom:8px;">
                    <div style="display:flex; gap:5px;">
                        <input type="date" id="m-female-dob" class="form-control" style="font-size:12px; padding:8px;">
                        <button type="button" class="btn-today" onclick="setToday('m-female-dob')">T</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="breeding-fields" style="display:none; background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); margin-bottom:14px;">
            <div class="form-row">
                <div class="form-group" style="flex:1;">
                    <label>성별</label>
                    <select id="b-gender" class="form-control">
                        <option value="male">수컷 (♂)</option>
                        <option value="female">암컷 (♀)</option>
                        <option value="mixed">암수혼합</option>
                        <option value="unknown">미상</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>마리수</label>
                    <input type="number" id="b-count" class="form-control" min="0" value="1">
                </div>
            </div>
            <div class="form-group">
                <label>DOB (출생일)</label>
                <div style="display:flex; gap:8px;">
                    <input type="date" id="b-dob" class="form-control">
                    <button type="button" class="btn-today" onclick="setToday('b-dob')">Today</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>특이사항 (Notes)</label>
            <textarea id="m-notes" class="form-control" rows="2"></textarea>
        </div>
        
        <div class="modal-btns">
            <button class="btn btn-delete" id="btn-delete" onclick="deleteCage()">삭제</button>
            <button class="btn btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn btn-save" id="btn-save" onclick="saveCage()">적용</button>
        </div>
    </div>
</div>

<div id="selection-marquee"></div>

<div id="overflow-banner">
    <div class="banner-left">
        <span class="banner-icon">🚨</span>
        <span id="banner-msg">랙 용량 초과 — 삐져나온 케이지를 먼저 해결하세요</span>
        <span class="banner-racks" id="banner-racks"></span>
    </div>
    <div class="banner-btns">
        <button class="banner-btn go" id="banner-goto" onclick="goToNextOverflowRack()">📍 해당 랙으로</button>
    </div>
</div>

<div class="batch-bar" id="batch-bar">
    <span class="batch-count" id="batch-count">0개 선택됨</span>
    <span class="contiguous-badge" id="contiguous-badge"></span>
    <button class="header-btn" style="background: rgba(255,255,255,0.1);" onclick="clearSelection()">선택 해제</button>
    <button class="header-btn" id="btn-batch-move" style="background: #0a84ff; border-color: #0a84ff;" onclick="startBatchMove()">🚚 일괄 이동</button>
    <button class="header-btn" style="background: #FF375F; border-color: #FF375F;" onclick="deleteSelectedCages()">🗑️ 일괄 삭제</button>
</div>

<script>
    let RACK_ROWS = { 'A': 5, 'B': 5, 'C': 5, 'D': 3, 'E': 3 };
    let currentRack = 'A';
    let STRAIN_MAP = { 'A': 'K18-hACE2', 'C': 'Aim2', 'W': 'Wild Type' };

    // 💡 신규 데이터 스키마에 맞춘 테스트용 데이터 100% 생성
    let cages = [];
    ['A', 'B', 'C'].forEach(rack => {
        for(let i=0; i<35; i++) {
            let isMating = (i % 3 === 0);
            cages.push({ 
                id: `${rack}_${i}`, rackId: rack, cellIdx: i, type: isMating ? 'mating' : 'breeding', 
                code: rack === 'B' ? 'C' : 'A', subId: isMating ? `${i+1}` : `-${i+1}`, notes: '',
                // Mating Fields
                dom: isMating ? '2026-05-10' : '', mMale: isMating ? 1 : 0, mGeno: '', mDob: '', mFemale: isMating ? 2 : 0, fGeno: '', fDob: '',
                // Breeding Fields
                gender: isMating ? '' : 'female', bCount: isMating ? 0 : 3, bDob: isMating ? '' : '2026-04-01'
            });
        }
    });
    for(let i=0; i<8; i++) {
        cages.push({ 
            id: `D_${i}`, rackId: 'D', cellIdx: i, type: 'breeding', code: 'W', subId: `${i+1}`, notes: '',
            dom: '', mMale: 0, mGeno: '', mDob: '', mFemale: 0, fGeno: '', fDob: '',
            gender: 'male', bCount: 2, bDob: ''
        });
    }

    let isBatchMode = false;
    let selectedIds = new Set();
    let dragData = { active: false, isDragging: false, items: [], primaryId: null, blockOffset: 0, startX: 0, startY: 0 };
    let marquee = { active: false, startX: 0, startY: 0 };
    let currentHoverIdx = -1;
    let batchMoveMode = false;
    let overflowTargetRack = null;
    let overflowRackQueue = [];

    // --- 패널 및 외부 클릭 닫기 이벤트 ---
    document.addEventListener('pointerdown', (e) => {
        const matchPanel = document.getElementById('match-panel');
        if (matchPanel.classList.contains('open') && !matchPanel.contains(e.target) && !e.target.closest('header')) {
            saveAndCloseMatchPanel();
            return;
        }

        if (!isBatchMode) return; 
        if (e.button !== 0) return;
        if (e.target.closest('.cage') || e.target.closest('header') || e.target.closest('.map-nav') || e.target.closest('.modal') || e.target.closest('.batch-bar')) return;
        
        e.preventDefault();
        marquee.active = true;
        marquee.startX = e.clientX;
        marquee.startY = e.clientY;
        marquee.initialSelected = new Set(selectedIds);

        const box = document.getElementById('selection-marquee');
        box.style.display = 'block';
        box.style.left = e.clientX + 'px'; box.style.top = e.clientY + 'px';
        box.style.width = '0px'; box.style.height = '0px';

        document.addEventListener('pointermove', onMarqueeMove);
        document.addEventListener('pointerup', onMarqueeUp);
    });

    function getOverflowStatus() {
        const overflowed = [];
        for (const rName of Object.keys(RACK_ROWS)) {
            const cap = RACK_ROWS[rName] * 7;
            const overCages = cages.filter(c => c.rackId === rName && c.cellIdx >= cap);
            if (overCages.length > 0) overflowed.push({ rack: rName, count: overCages.length, capacity: cap, overCages });
        }
        return overflowed;
    }

    function isOverflowing() { return getOverflowStatus().length > 0; }

    function updateOverflowUI() {
        const all = getOverflowStatus();
        const banner = document.getElementById('overflow-banner');
        const racksEl = document.getElementById('banner-racks');

        if (all.length === 0) {
            document.body.classList.remove('overflow-alert');
            banner.classList.remove('show');
            overflowRackQueue = [];
            return;
        }
        document.body.classList.add('overflow-alert');
        banner.classList.add('show');
        overflowRackQueue = all.map(o => o.rack);
        racksEl.innerText = all.map(o => `Rack ${o.rack} +${o.count}`).join('  /  ');
    }

    function goToNextOverflowRack() {
        if (overflowRackQueue.length === 0) return;
        const idx = overflowRackQueue.indexOf(currentRack);
        currentRack = overflowRackQueue[(idx + 1) % overflowRackQueue.length];
        buildLeftSidebar(); renderMainBoard();
    }

    function blockIfOverflow() { return isOverflowing(); }

    function checkContiguous() {
        if (selectedIds.size === 0) return { ok: false, cages: [] };
        if (selectedIds.size === 1) return { ok: true, cages: [] };

        const rackOrder = ['A', 'B', 'C', 'D', 'E'];
        const selected = cages.filter(c => selectedIds.has(c.id));

        function getAbsoluteIdx(cage) {
            let offset = 0;
            for (const rName of rackOrder) {
                if (rName === cage.rackId) break;
                offset += RACK_ROWS[rName] * 7;
            }
            return offset + cage.cellIdx;
        }

        const sorted = selected.slice().sort((a, b) => getAbsoluteIdx(a) - getAbsoluteIdx(b));
        const indices = sorted.map(c => getAbsoluteIdx(c));
        let isContiguous = true;
        for (let i = 0; i < indices.length - 1; i++) {
            if (indices[i+1] !== indices[i] + 1) { isContiguous = false; break; }
        }
        return { ok: isContiguous, cages: sorted };
    }

    function toggleBatchMode() {
        isBatchMode = !isBatchMode;
        const btn = document.getElementById('btn-batch');
        if (isBatchMode) {
            document.body.classList.add('batch-mode');
            btn.classList.add('btn-active');
            btn.innerText = '✅ 선택 완료';
            batchMoveMode = false;
        } else {
            document.body.classList.remove('batch-mode');
            btn.classList.remove('btn-active');
            btn.innerText = '☑️ 일괄 선택';
            marquee.active = false; batchMoveMode = false;
            document.getElementById('selection-marquee').style.display = 'none';
            clearSelection();
        }
    }

    function startBatchMove() {
        const result = checkContiguous();
        if (!result.ok) return;

        batchMoveMode = true; isBatchMode = false;
        document.body.classList.remove('batch-mode');
        const btn = document.getElementById('btn-batch');
        btn.classList.remove('btn-active'); btn.innerText = '☑️ 일괄 선택';

        const bar = document.getElementById('batch-bar');
        document.getElementById('batch-count').innerText = `${selectedIds.size}개 케이지 이동 준비됨`;
        document.getElementById('contiguous-badge').className = 'contiguous-badge ok';
        document.getElementById('contiguous-badge').innerText = '✦ 드래그하여 이동';
        document.getElementById('btn-batch-move').style.display = 'none';
        bar.classList.add('show');
    }

    function onMarqueeMove(e) {
        if (!marquee.active) return;
        const box = document.getElementById('selection-marquee');
        const x = Math.min(e.clientX, marquee.startX); const y = Math.min(e.clientY, marquee.startY);
        const w = Math.abs(e.clientX - marquee.startX); const h = Math.abs(e.clientY - marquee.startY);
        box.style.left = x + 'px'; box.style.top = y + 'px'; box.style.width = w + 'px'; box.style.height = h + 'px';

        const newSelected = new Set(marquee.initialSelected);
        document.querySelectorAll('#main-grid .cage').forEach(el => {
            const r = el.getBoundingClientRect();
            if (!(r.right < x || r.left > x + w || r.bottom < y || r.top > y + h)) newSelected.add(el.id);
        });

        selectedIds = newSelected; updateSelectionUI();
    }

    function onMarqueeUp(e) {
        if (!marquee.active) return;
        marquee.active = false;
        document.getElementById('selection-marquee').style.display = 'none';
        document.removeEventListener('pointermove', onMarqueeMove);
        document.removeEventListener('pointerup', onMarqueeUp);
        updateSelectionUI();
    }

    function setupDragEngine(cageEl, cageId) {
        cageEl.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return; 
            e.preventDefault(); e.stopPropagation();

            if (isBatchMode) {
                if (selectedIds.has(cageId)) selectedIds.delete(cageId);
                else selectedIds.add(cageId);
                updateSelectionUI(); return; 
            }

            if (batchMoveMode && selectedIds.has(cageId)) {
                dragData.active = true; dragData.isDragging = false;
                dragData.startX = e.clientX; dragData.startY = e.clientY;
                dragData.primaryId = cageId; dragData.items = [];

                const result = checkContiguous();
                if (result.ok && result.cages.length > 0) {
                    const currentRackSelected = result.cages.filter(c => c.rackId === currentRack).sort((a, b) => a.cellIdx - b.cellIdx);
                    if (currentRackSelected.length > 0) {
                        dragData.blockOffset = currentRackSelected.findIndex(c => c.id === cageId);
                        if (dragData.blockOffset === -1) dragData.blockOffset = 0;
                        currentRackSelected.forEach(c => {
                            let el = document.getElementById(c.id);
                            if (!el) return;
                            let rect = el.getBoundingClientRect();
                            dragData.items.push({ id: c.id, el, shiftX: e.clientX - rect.left, shiftY: e.clientY - rect.top });
                        });
                    } else initSingleDrag(cageEl, cageId, e);
                } else initSingleDrag(cageEl, cageId, e);

                document.addEventListener('pointermove', onPointerMove); document.addEventListener('pointerup', onPointerUp);
                return;
            }

            dragData.active = true; dragData.isDragging = false;
            dragData.startX = e.clientX; dragData.startY = e.clientY;
            dragData.primaryId = cageId; dragData.items = [];

            if (!selectedIds.has(cageId)) {
                clearSelection(); initSingleDrag(cageEl, cageId, e);
            } else {
                let selectedCages = cages.filter(c => selectedIds.has(c.id) && c.rackId === currentRack).sort((a, b) => a.cellIdx - b.cellIdx);
                let isContiguous = true;
                for (let i = 0; i < selectedCages.length - 1; i++) { if (selectedCages[i+1].cellIdx !== selectedCages[i].cellIdx + 1) { isContiguous = false; break; } }
                if (isContiguous && selectedCages.length > 0) {
                    dragData.blockOffset = selectedCages.findIndex(c => c.id === cageId);
                    selectedCages.forEach(c => {
                        let el = document.getElementById(c.id);
                        let rect = el.getBoundingClientRect();
                        dragData.items.push({ id: c.id, el, shiftX: e.clientX - rect.left, shiftY: e.clientY - rect.top });
                    });
                } else initSingleDrag(cageEl, cageId, e); 
            }
            document.addEventListener('pointermove', onPointerMove); document.addEventListener('pointerup', onPointerUp);
        });
    }

    function initSingleDrag(cageEl, cageId, e) {
        dragData.blockOffset = 0; let rect = cageEl.getBoundingClientRect();
        dragData.items.push({ id: cageId, el: cageEl, shiftX: e.clientX - rect.left, shiftY: e.clientY - rect.top });
    }

    function onPointerMove(e) {
        if (!dragData.active) return;
        if (!dragData.isDragging) {
            if (Math.abs(e.clientX - dragData.startX) > 5 || Math.abs(e.clientY - dragData.startY) > 5) {
                dragData.isDragging = true;
                dragData.items.forEach(item => {
                    const rect = item.el.getBoundingClientRect();
                    document.body.appendChild(item.el);
                    item.el.classList.add('floating'); item.el.classList.remove('selected');
                    
                    if (item.id === dragData.primaryId) {
                        item.el.style.width = rect.width + 'px'; item.el.style.height = rect.height + 'px';
                        item.el.style.transformOrigin = `${dragData.shiftX}px ${dragData.shiftY}px`;
                        if (dragData.items.length > 1) {
                            let badge = document.createElement('div'); badge.className = 'drag-badge'; badge.id = 'drag-badge';
                            badge.innerText = dragData.items.length; item.el.appendChild(badge);
                        }
                    } else item.el.style.display = 'none'; 
                });
            } else return; 
        }

        dragData.items.forEach(item => {
            if (item.id === dragData.primaryId) {
                item.el.style.left = (e.clientX - item.shiftX) + 'px'; item.el.style.top = (e.clientY - item.shiftY) + 'px';
            }
        });

        let hoveredRack = null;
        document.querySelectorAll('.map-rack').forEach(rackEl => {
            const r = rackEl.getBoundingClientRect();
            if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
                rackEl.classList.add('drag-over'); hoveredRack = rackEl.dataset.rack;
            } else rackEl.classList.remove('drag-over');
        });

        if (hoveredRack && hoveredRack !== currentRack) { currentRack = hoveredRack; renderMainBoard(); buildLeftSidebar(); }

        let minD = 9999; let hoverIdx = -1;
        document.querySelectorAll('#main-grid .slot').forEach(slot => {
            const r = slot.getBoundingClientRect();
            const d = Math.hypot((r.left + r.width/2) - e.clientX, (r.top + r.height/2) - e.clientY);
            if (d < minD && d < 55) { minD = d; hoverIdx = parseInt(slot.dataset.idx); }
        });
        previewShift(hoverIdx);
    }

    function calculateShiftLogic(targetIdx, isSim) {
        if (targetIdx === -1) return null;
        let K = dragData.items.length;
        let blockTargetIdx = targetIdx - dragData.blockOffset;
        let capacity = RACK_ROWS[currentRack] * 7;
        
        if (blockTargetIdx < 0) blockTargetIdx = 0;
        if (blockTargetIdx + K > capacity) blockTargetIdx = capacity - K;

        let blockEnd = blockTargetIdx + K - 1;
        let dragIds = dragData.items.map(i => i.id);
        
        let workCages = cages.filter(c => c.rackId === currentRack && !dragIds.includes(c.id)).map(c => ({...c}));
        let occupants = workCages.filter(c => c.cellIdx >= blockTargetIdx && c.cellIdx <= blockEnd);

        if (occupants.length > 0) {
            let isLeftmost = (blockTargetIdx % 7 === 0);
            let shiftedLeft = false;
            if (!isLeftmost) {
                let emptyLeftSlots = [];
                for (let i = blockTargetIdx - 1; i >= 0; i--) {
                    if (!workCages.some(c => c.cellIdx === i)) emptyLeftSlots.push(i);
                    if (emptyLeftSlots.length >= occupants.length) break;
                }
                if (emptyLeftSlots.length >= occupants.length) {
                    occupants.sort((a,b) => b.cellIdx - a.cellIdx);
                    occupants.forEach((occ, idx) => occ.cellIdx = emptyLeftSlots[idx]);
                    shiftedLeft = true;
                }
            }
            if (!shiftedLeft) {
                let emptyRightSlots = [];
                for (let i = blockEnd + 1; i < capacity + 100; i++) {
                    if (!workCages.some(c => c.cellIdx === i)) emptyRightSlots.push(i);
                    if (emptyRightSlots.length >= occupants.length) break;
                }
                occupants.sort((a,b) => a.cellIdx - b.cellIdx);
                occupants.forEach((occ, idx) => occ.cellIdx = emptyRightSlots[idx]);
            }
        }
        return { blockTargetIdx, workCages };
    }

    function previewShift(targetIdx) {
        if (currentHoverIdx === targetIdx) return; 
        currentHoverIdx = targetIdx;
        const grid = document.getElementById('main-grid');
        const slots = grid.querySelectorAll('.slot');
        let result = calculateShiftLogic(targetIdx, true);
        if (!result) return;
        result.workCages.forEach(cage => {
            const el = document.getElementById(cage.id);
            const targetSlot = slots[cage.cellIdx];
            if (el && targetSlot) { el.style.left = targetSlot.offsetLeft + 'px'; el.style.top = targetSlot.offsetTop + 'px'; }
        });
    }

    function onPointerUp(e) {
        if (!dragData.active) return;
        dragData.active = false;
        document.removeEventListener('pointermove', onPointerMove); document.removeEventListener('pointerup', onPointerUp);

        if (!dragData.isDragging) {
            if (!batchMoveMode) { clearSelection(); openModal(dragData.primaryId); }
            return;
        }

        let finalIdx = currentHoverIdx; previewShift(-1); 
        
        dragData.items.forEach(item => {
            item.el.classList.remove('floating'); item.el.style.display = '';
            let badge = document.getElementById('drag-badge'); if (badge) badge.remove();
            item.el.remove();
        });

        if (finalIdx !== -1) {
            let result = calculateShiftLogic(finalIdx, false);
            if (result) {
                result.workCages.forEach(wc => { let target = cages.find(c => c.id === wc.id); if (target) target.cellIdx = wc.cellIdx; });
                dragData.items.forEach((item, idx) => {
                    let target = cages.find(c => c.id === item.id);
                    if (target) { target.rackId = currentRack; target.cellIdx = result.blockTargetIdx + idx; }
                });
            }
        }

        if (batchMoveMode) { batchMoveMode = false; clearSelection(); } else { clearSelection(); }
        renderMainBoard();
        document.querySelectorAll('.map-rack').forEach(el => el.classList.remove('drag-over'));
    }

    function updateSelectionUI() {
        document.querySelectorAll('.cage').forEach(el => {
            if (selectedIds.has(el.id)) el.classList.add('selected'); else el.classList.remove('selected');
        });

        const bar = document.getElementById('batch-bar'); const badge = document.getElementById('contiguous-badge');
        const moveBtn = document.getElementById('btn-batch-move'); const batchBtn = document.getElementById('btn-batch');

        if (selectedIds.size > 0 && !batchMoveMode) {
            bar.classList.add('show'); document.getElementById('batch-count').innerText = `${selectedIds.size}개 케이지 선택됨`;
            const result = checkContiguous();
            if (result.ok) {
                badge.className = 'contiguous-badge ok'; badge.innerText = '✦ 연속 배치 (이동 가능)';
                moveBtn.style.display = ''; moveBtn.removeAttribute('disabled'); batchBtn.removeAttribute('disabled');
            } else {
                badge.className = 'contiguous-badge ng'; badge.innerText = '✕ 비연속 (이동 불가)';
                moveBtn.setAttribute('disabled', true); batchBtn.setAttribute('disabled', true);
            }
        } else if (selectedIds.size === 0 && !batchMoveMode) {
            bar.classList.remove('show'); badge.className = 'contiguous-badge'; badge.innerText = '';
            batchBtn.removeAttribute('disabled'); moveBtn.style.display = '';
        }
    }

    function clearSelection() {
        selectedIds.clear(); batchMoveMode = false; document.getElementById('btn-batch-move').style.display = '';
        const batchBtn = document.getElementById('btn-batch'); batchBtn.removeAttribute('disabled');
        if (!isBatchMode) { batchBtn.classList.remove('btn-active'); batchBtn.innerText = '☑️ 일괄 선택'; }
        updateSelectionUI();
    }

    function deleteSelectedCages() {
        if (!confirm(`선택한 ${selectedIds.size}개의 케이지를 모두 삭제하시겠습니까?`)) return;
        cages = cages.filter(c => !selectedIds.has(c.id));
        clearSelection(); renderMainBoard(); buildLeftSidebar();
    }

    function renderMainBoard() {
        const grid = document.getElementById('main-grid');
        document.getElementById('current-rack-title').innerText = `Rack ${currentRack}`;
        
        const baseCapacity = RACK_ROWS[currentRack] * 7;
        const currentCages = cages.filter(c => c.rackId === currentRack);
        const maxIdx = currentCages.reduce((max, c) => Math.max(max, c.cellIdx), baseCapacity - 1);
        const totalCapacity = maxIdx + 1;

        document.getElementById('current-rack-desc').innerText = `${RACK_ROWS[currentRack]}행 × 7열 (${baseCapacity}칸 내부 정원)`;
        Array.from(grid.children).forEach(child => { if (child.classList.contains('slot')) child.remove(); });

        let slotsFragment = document.createDocumentFragment();
        for (let i = 0; i < totalCapacity; i++) {
            const slot = document.createElement('div'); slot.className = 'slot' + (i >= baseCapacity ? ' ghost-slot' : '');
            const rChar = String.fromCharCode(64 + Math.floor(i / 7) + 1);
            slot.setAttribute('data-label', `${rChar}-${(i % 7) + 1}`); slot.dataset.idx = i;
            slot.onclick = () => { if (!isBatchMode && !batchMoveMode) { clearSelection(); openModal(null, i); } };
            slotsFragment.appendChild(slot);
        }
        grid.prepend(slotsFragment);

        const slots = grid.querySelectorAll('.slot');
        const currentCageIds = currentCages.map(c => c.id);
        let dragIds = dragData.active && dragData.isDragging ? dragData.items.map(i => i.id) : [];

        Array.from(grid.querySelectorAll('.cage')).forEach(el => {
            if (!currentCageIds.includes(el.id) && !dragIds.includes(el.id)) el.remove();
        });

        currentCages.forEach(cage => {
            if (dragIds.includes(cage.id)) return; 

            let el = document.getElementById(cage.id);
            let displaySub = cage.subId || '';
            let htmlContent = cage.type === 'mating' 
                ? `<span class="strain-code" style="font-size:24px; letter-spacing:-1px;">${cage.code}${displaySub}</span>` 
                : `<span class="strain-code">${cage.code}</span>` + (displaySub ? `<span class="sub-id">${displaySub}</span>` : '');

            if (!el) {
                el = document.createElement('div'); el.id = cage.id; 
                el.className = `cage ${cage.type}`; el.innerHTML = htmlContent;
                setupDragEngine(el, cage.id); grid.appendChild(el);
            } else {
                // 💡 [핵심 버그 수정] 기존 요소 재사용 시 데이터 변화(텍스트/컬러) 완벽 동기화
                el.className = `cage ${cage.type}`; el.innerHTML = htmlContent;
            }

            if (selectedIds.has(cage.id)) el.classList.add('selected'); else el.classList.remove('selected');

            setTimeout(() => {
                const targetSlot = slots[cage.cellIdx];
                if (targetSlot) { el.style.left = targetSlot.offsetLeft + 'px'; el.style.top = targetSlot.offsetTop + 'px'; }
            }, 10);
        });
        updateStatsBar();
    }

    function buildLeftSidebar() {
        const configBox = document.getElementById('config-box'); configBox.innerHTML = '';
        for (const [rName, rows] of Object.entries(RACK_ROWS)) {
            const rowDiv = document.createElement('div'); rowDiv.className = 'config-row';
            rowDiv.innerHTML = `<span>Rack ${rName} 세로 줄 수</span><input type="number" class="config-input" value="${rows}" min="1" max="10" data-rack="${rName}">`;
            rowDiv.querySelector('input').onchange = (e) => { RACK_ROWS[e.target.dataset.rack] = parseInt(e.target.value); renderMainBoard(); buildLeftSidebar(); };
            configBox.appendChild(rowDiv);
        }
        document.querySelectorAll('.map-rack').forEach(rackEl => {
            const rackName = rackEl.dataset.rack;
            rackEl.onclick = () => { currentRack = rackName; buildLeftSidebar(); renderMainBoard(); };
            if(rackName === currentRack) rackEl.classList.add('active'); else rackEl.classList.remove('active');
        });
    }

    const modal = document.getElementById('modal');
    let targetSlotIdxForCreate = null;

    // --- 💡 [신규] Today 날짜 세팅 및 Genotype 매칭 함수 ---
    function setToday(inputId) {
        const tzOffset = (new Date()).getTimezoneOffset() * 60000; 
        const today = (new Date(Date.now() - tzOffset)).toISOString().split('T')[0];
        document.getElementById(inputId).value = today;
    }

    function updateGenotypeDisplay() {
        const codeInput = document.getElementById('m-code').value.toUpperCase();
        const display = document.getElementById('genotype-display');
        if (!codeInput) {
            display.innerText = "Genotype: 기호를 입력하세요";
            display.style.color = "var(--text-sub)";
        } else if (STRAIN_MAP[codeInput]) {
            display.innerText = `Genotype: ${STRAIN_MAP[codeInput]}`;
            display.style.color = "#34c759"; // 초록색 매칭 성공
        } else {
            display.innerText = "Genotype: 매칭 안됨 (매칭표 확인)";
            display.style.color = "#FF375F"; // 빨간색 매칭 실패
        }
    }

    function openModal(cageId, slotIdx = null) {
        const overflow = blockIfOverflow();
        if (!cageId) { if (overflow) return; targetSlotIdxForCreate = slotIdx; }

        if (cageId) {
            const c = cages.find(x => x.id === cageId);
            document.getElementById('m-id').value = c.id;
            document.getElementById('m-type').value = c.type; document.getElementById('m-code').value = c.code;
            document.getElementById('m-sub').value = c.subId; document.getElementById('m-notes').value = c.notes || "";
            
            // Mating Fields
            document.getElementById('m-dom').value = c.dom || "";
            document.getElementById('m-male-count').value = c.mMale || 0;
            document.getElementById('m-male-geno').value = c.mGeno || "";
            document.getElementById('m-male-dob').value = c.mDob || "";
            document.getElementById('m-female-count').value = c.mFemale || 0;
            document.getElementById('m-female-geno').value = c.fGeno || "";
            document.getElementById('m-female-dob').value = c.fDob || "";
            
            // Breeding Fields
            document.getElementById('b-gender').value = c.gender || "unknown";
            document.getElementById('b-count').value = c.bCount || 0;
            document.getElementById('b-dob').value = c.bDob || "";

            document.getElementById('btn-delete').style.display = 'block';

            if (overflow) {
                document.getElementById('modal-title').innerHTML = '케이지 삭제 전용 <span style="font-size:11px;color:#FF375F;font-weight:600;background:rgba(255,55,95,0.12);padding:2px 8px;border-radius:6px;border:1px solid rgba(255,55,95,0.3);">⚠ 초과 상태 — 수정 불가</span>';
                document.getElementById('btn-save').setAttribute('disabled', true); document.getElementById('btn-save').style.opacity = '0.3'; document.getElementById('btn-save').style.cursor = 'not-allowed';
                document.querySelectorAll('#modal .form-control').forEach(el => el.setAttribute('disabled', true));
                document.getElementById('m-type').setAttribute('disabled', true);
            } else {
                document.getElementById('modal-title').innerText = '케이지 데이터 편집';
                document.getElementById('btn-save').removeAttribute('disabled'); document.getElementById('btn-save').style.opacity = ''; document.getElementById('btn-save').style.cursor = '';
                document.querySelectorAll('#modal .form-control').forEach(el => el.removeAttribute('disabled'));
                document.getElementById('m-type').removeAttribute('disabled');
            }
        } else {
            targetSlotIdxForCreate = slotIdx;
            document.getElementById('modal-title').innerText = `신규 등록 (Rack ${currentRack})`; document.getElementById('m-id').value = "";
            document.getElementById('m-type').value = "breeding"; document.getElementById('m-code').value = "";
            document.getElementById('m-sub').value = ""; document.getElementById('m-notes').value = "";
            
            document.getElementById('m-dom').value = ""; document.getElementById('m-male-count').value = ""; document.getElementById('m-male-geno').value = ""; document.getElementById('m-male-dob').value = "";
            document.getElementById('m-female-count').value = ""; document.getElementById('m-female-geno').value = ""; document.getElementById('m-female-dob').value = "";
            
            document.getElementById('b-gender').value = "female"; document.getElementById('b-count').value = 1; document.getElementById('b-dob').value = "";
            
            document.getElementById('btn-delete').style.display = 'none';
            document.getElementById('btn-save').removeAttribute('disabled'); document.getElementById('btn-save').style.opacity = ''; document.getElementById('btn-save').style.cursor = '';
            document.querySelectorAll('#modal .form-control').forEach(el => el.removeAttribute('disabled'));
        }
        toggleModalFields(); updateGenotypeDisplay(); modal.style.display = 'flex';
    }

    function toggleModalFields() {
        const type = document.getElementById('m-type').value;
        if (type === 'mating') {
            document.getElementById('breeding-fields').style.display = 'none'; document.getElementById('mating-fields').style.display = 'block';
        } else {
            document.getElementById('mating-fields').style.display = 'none'; document.getElementById('breeding-fields').style.display = 'block';
        }
    }

    function closeModal() { modal.style.display = 'none'; dragData.id = null; }

    function saveCage() {
        if (blockIfOverflow() && !document.getElementById('m-id').value) { closeModal(); return; }
        const id = document.getElementById('m-id').value;
        const info = {
            type: document.getElementById('m-type').value, code: document.getElementById('m-code').value.toUpperCase(),
            subId: document.getElementById('m-sub').value, notes: document.getElementById('m-notes').value,
            dom: document.getElementById('m-dom').value, mMale: parseInt(document.getElementById('m-male-count').value) || 0,
            mGeno: document.getElementById('m-male-geno').value, mDob: document.getElementById('m-male-dob').value,
            mFemale: parseInt(document.getElementById('m-female-count').value) || 0, fGeno: document.getElementById('m-female-geno').value,
            fDob: document.getElementById('m-female-dob').value, gender: document.getElementById('b-gender').value,
            bCount: parseInt(document.getElementById('b-count').value) || 0, bDob: document.getElementById('b-dob').value
        };
        if (id) { Object.assign(cages.find(x => x.id === id), info); } 
        else { cages.push({ id: 'c_' + Date.now(), rackId: currentRack, cellIdx: targetSlotIdxForCreate, ...info }); }
        closeModal(); renderMainBoard(); buildLeftSidebar();
    }

    function deleteCage() {
        const targetId = document.getElementById('m-id').value;
        cages = cages.filter(c => c.id !== targetId);
        if (dragData.id === targetId) dragData.id = null;
        closeModal(); renderMainBoard(); buildLeftSidebar();
    }

    // --- 💡 [신규] 자유로운 Strain 커스텀 패널 로직 ---
    function openMatchPanel(e) {
        e.stopPropagation();
        if (blockIfOverflow()) return;
        const listContainer = document.getElementById('mapping-list'); listContainer.innerHTML = '';
        for(const [key, val] of Object.entries(STRAIN_MAP)) { listContainer.appendChild(createStrainRow(key, val)); }
        document.getElementById('match-panel').classList.add('open');
    }

    function createStrainRow(key, val) {
        const row = document.createElement('div'); row.className = 'match-row';
        row.innerHTML = `
            <input type="text" class="match-key-input" value="${key}" maxlength="2" placeholder="기호" style="width:40px; text-align:center; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15); color:#ffcc00; font-weight:bold; border-radius:8px; padding:8px;">
            <input type="text" class="match-val-input" value="${val}" placeholder="Strain 명칭 입력" style="flex:1; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15); color:white; padding:8px; border-radius:8px;">
            <button onclick="this.parentElement.remove()" style="background:none; border:none; color:#FF375F; font-size:20px; font-weight:bold; cursor:pointer; padding:0 5px;">×</button>
        `;
        return row;
    }

    function addStrainRow() { document.getElementById('mapping-list').appendChild(createStrainRow('', '')); }

    function saveAndCloseMatchPanel() {
        STRAIN_MAP = {};
        document.querySelectorAll('.match-row').forEach(row => {
            const key = row.querySelector('.match-key-input').value.trim().toUpperCase();
            const val = row.querySelector('.match-val-input').value.trim();
            if (key) STRAIN_MAP[key] = val;
        });
        document.getElementById('match-panel').classList.remove('open');
        updateGenotypeDisplay(); // 현재 열려있는 모달이 있다면 글씨 업데이트
    }

    function updateStatsBar() {
        const total = Object.values(RACK_ROWS).reduce((a,b)=>a+b, 0) * 7;
        const currentCount = cages.length;
        const rate = total > 0 ? Math.round((currentCount / total) * 100) : 0;
        document.getElementById('occupancy-label').innerText = `${rate}% (${currentCount}/${total} 칸)`;
        document.getElementById('occupancy-bar').style.width = `${rate}%`;
        updateOverflowUI(); 
    }

    buildLeftSidebar(); renderMainBoard();
</script>
</body>
</html>
